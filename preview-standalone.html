<!DOCTYPE html>

<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎮 Gamer Chat Overlay — Preview</title>

  <!-- ══ CSS de la barre de contrôle (preview shell) ══ -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: linear-gradient(135deg, #05070f 0%, #0a0e1a 50%, #0d1220 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: 'Inter', system-ui, sans-serif;
      color: #e2e8f8;
    }

    /* ─ Top control bar ─ */
    .preview-bar {
      width: 100%;
      background: rgba(6, 8, 16, 0.8);
      backdrop-filter: blur(20px);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      border-bottom: 1px solid rgba(0, 200, 255, 0.12);
      z-index: 100;
      position: sticky;
      top: 0;
    }

    .preview-bar h1 {
      color: #00c8ff;
      font-family: 'Rajdhani', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      flex-shrink: 0;
      text-shadow: 0 0 12px rgba(0,200,255,0.5);
    }

    .sep { width: 1px; height: 22px; background: rgba(255,255,255,0.12); flex-shrink: 0; }

    .ctrl-group { display: flex; align-items: center; gap: 5px; }
    .ctrl-group label {
      color: rgba(165, 185, 215, 0.6);
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      white-space: nowrap;
      font-family: 'Rajdhani', sans-serif;
    }
    .ctrl-group select {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.14);
      color: #e2e8f8;
      border-radius: 6px;
      padding: 3px 7px;
      font-size: 12px;
      cursor: pointer;
      outline: none;
      font-family: 'Inter', sans-serif;
    }
    .ctrl-group input[type="range"] {
      width: 70px;
      accent-color: #00c8ff;
      cursor: pointer;
    }
    .ctrl-group input[type="color"] {
      width: 28px; height: 24px; padding: 2px;
      border-radius: 5px; border: 1px solid rgba(255,255,255,0.15);
      background: none; cursor: pointer;
    }
    .ctrl-group input[type="number"] {
      width: 64px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.14);
      color: #e2e8f8;
      border-radius: 6px;
      padding: 3px 6px;
      font-size: 12px;
      outline: none;
      font-family: 'Inter', sans-serif;
    }
    .ctrl-group input[type="text"] {
      width: 130px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.14);
      color: #e2e8f8;
      border-radius: 6px;
      padding: 3px 7px;
      font-size: 12px;
      outline: none;
      font-family: 'Inter', sans-serif;
    }

    .btn {
      background: rgba(0, 200, 255, 0.15);
      color: #00c8ff;
      border: 1px solid rgba(0, 200, 255, 0.35);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 700;
      font-family: 'Rajdhani', sans-serif;
      cursor: pointer;
      white-space: nowrap;
      letter-spacing: 0.5px;
      transition: background 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
      text-transform: uppercase;
    }
    .btn:hover  { background: rgba(0, 200, 255, 0.25); box-shadow: 0 0 10px rgba(0,200,255,0.2); }
    .btn:active { transform: scale(0.94); }
    .btn.green  { background: rgba(0,255,136,0.12); color: #00ff88; border-color: rgba(0,255,136,0.3); }
    .btn.green:hover { background: rgba(0,255,136,0.22); box-shadow: 0 0 10px rgba(0,255,136,0.2); }
    .btn.purple { background: rgba(168,85,247,0.12); color: #a855f7; border-color: rgba(168,85,247,0.3); }
    .btn.purple:hover { background: rgba(168,85,247,0.22); }
    .btn.orange { background: rgba(255,194,0,0.12); color: #ffc200; border-color: rgba(255,194,0,0.3); }
    .btn.orange:hover { background: rgba(255,194,0,0.22); }
    .btn.red    { background: rgba(255,42,94,0.12); color: #ff2a5e; border-color: rgba(255,42,94,0.3); }
    .btn.red:hover { background: rgba(255,42,94,0.22); }
    .btn.dark   { background: rgba(255,255,255,0.07); color: rgba(165,185,215,0.7); border-color: rgba(255,255,255,0.12); }
    .btn.dark:hover { background: rgba(255,255,255,0.12); }

    .section-label {
      font-family: 'Rajdhani', sans-serif;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(0,200,255,0.5);
      padding: 2px 6px;
      border: 1px solid rgba(0,200,255,0.2);
      border-radius: 4px;
    }

    /* ─ Preview stage ─ */
    .preview-stage {
      position: relative;
      width: 460px;
      height: 620px;
      margin: 24px auto 32px;
      border-radius: 14px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(0, 200, 255, 0.12),
        0 32px 80px rgba(0,0,0,0.7),
        0 0 60px rgba(0,200,255,0.04);
    }

    /* Scanline overlay on preview */
    .preview-stage::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.04) 2px,
        rgba(0,0,0,0.04) 4px
      );
      pointer-events: none;
      z-index: 10;
      border-radius: 14px;
    }

    /* Corner brackets */
    .preview-stage::before {
      content: '';
      position: absolute;
      inset: 0;
      border: 1px solid rgba(0, 200, 255, 0.15);
      border-radius: 14px;
      pointer-events: none;
      z-index: 11;
    }

    .corner-tl, .corner-tr, .corner-bl, .corner-br {
      position: absolute;
      width: 16px;
      height: 16px;
      border-color: #00c8ff;
      border-style: solid;
      z-index: 12;
    }
    .corner-tl { top: 8px;  left: 8px;  border-width: 2px 0 0 2px; border-radius: 3px 0 0 0; }
    .corner-tr { top: 8px;  right: 8px; border-width: 2px 2px 0 0; border-radius: 0 3px 0 0; }
    .corner-bl { bottom: 8px; left: 8px;  border-width: 0 0 2px 2px; border-radius: 0 0 0 3px; }
    .corner-br { bottom: 8px; right: 8px; border-width: 0 2px 2px 0; border-radius: 0 0 3px 0; }

    #widget-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* ─ Status badge ─ */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #00ff88;
      padding: 3px 8px;
      background: rgba(0,255,136,0.1);
      border: 1px solid rgba(0,255,136,0.25);
      border-radius: 5px;
    }
    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #00ff88;
      box-shadow: 0 0 6px #00ff88;
      animation: statusPulse 1.5s ease-in-out infinite;
    }
    @keyframes statusPulse {
      0%,100% { opacity: 1; }
      50%      { opacity: 0.4; }
    }
  </style>

  <!-- ══ Widget HTML (stocké en texte pour injection dans l'iframe) ══ -->
  <script type="text/plain" id="widget-html">
<div id="goal-bar" class="goal-bar goal-horizontal">
  <div class="goal-inner">
    <div class="goal-header">
      <span class="goal-title" id="goal-title">Objectif</span>
      <span class="goal-values">
        <span id="goal-current">0</span>
        <span class="goal-sep"> / </span>
        <span id="goal-target">100</span>
      </span>
    </div>
    <div class="goal-track">
      <div id="goal-fill" class="goal-fill"></div>
    </div>
    <span class="goal-percent" id="goal-percent">0%</span>
  </div>
</div>
<div id="chat-wrapper">
  <div id="chat-container">
    <div id="chat-messages"></div>
  </div>
</div>
<div id="alert-overlay">
  <div id="alert-container"></div>
</div>
  </script>

  <!-- ══ Widget CSS ══ -->
  <script type="text/plain" id="widget-css">
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
:root{
  --neon-blue:#00c8ff;--neon-green:#00ff88;--neon-red:#ff2a5e;--neon-yellow:#ffd000;
  --neon-orange:#ff7700;--neon-pink:#ff00aa;--neon-purple:#a855f7;--neon-teal:#00ffd5;--neon-gold:#ffc200;
  --accent-color:#00c8ff;--font-size:14px;--bg-opacity:0.88;
  --mod-color:#00ff88;--vip-color:#a855f7;--sub-color:#ffc200;--broadcaster-color:#00c8ff;
  --bg-card:rgba(10,14,22,var(--bg-opacity));--bg-card-2:rgba(16,20,32,0.95);
  --text-primary:#e2e8f8;--text-secondary:rgba(165,185,215,0.65);--border-color:rgba(255,255,255,0.07);
  --radius-card:12px;--radius-badge:4px;--avatar-size:38px;--badge-h:17px;
  --msg-gap:10px;--pad-h:13px;--pad-v:8px;
  --spring:cubic-bezier(0.34,1.56,0.64,1);--ease-out:cubic-bezier(0.2,0,0,1);--power:cubic-bezier(0.16,1,0.3,1);
}
[data-theme="light"]{
  --bg-card:rgba(238,243,255,var(--bg-opacity));--bg-card-2:rgba(255,255,255,0.96);
  --text-primary:#0a0e1a;--text-secondary:rgba(30,45,80,0.6);--border-color:rgba(0,0,0,0.07);
}
[data-theme="amoled"]{
  --bg-card:rgba(0,0,0,var(--bg-opacity));--bg-card-2:rgba(6,6,6,0.98);
  --text-primary:#ffffff;--text-secondary:rgba(255,255,255,0.42);--border-color:rgba(255,255,255,0.05);
}
html,body{width:100%;height:100%;background:transparent;overflow:hidden;font-family:'Inter',system-ui,sans-serif;font-size:var(--font-size);line-height:1.4}
#chat-wrapper{width:100%;height:100%;perspective:1200px}
#chat-container{width:100%;height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:12px 10px;transform-style:preserve-3d;transition:transform 0.6s var(--ease-out)}
#chat-messages{display:flex;flex-direction:column;gap:var(--msg-gap);overflow:hidden}
.message{display:flex;align-items:flex-end;gap:8px;max-width:100%;opacity:0}
[data-animation="spring"] .message{transform:translateY(20px) scale(0.95);transition:transform 0.5s var(--spring),opacity 0.3s ease}
[data-animation="slide"] .message{transform:translateX(-30px);transition:transform 0.35s var(--power),opacity 0.25s ease}
[data-animation="fade"] .message{transition:opacity 0.35s ease}
[data-animation="none"] .message{transition:none}
.message.visible{opacity:1;transform:none}
.message.removing{opacity:0;transform:translateX(-16px) scale(0.94) !important;transition:opacity 0.25s ease,transform 0.25s ease !important;max-height:0;overflow:hidden;margin-bottom:0 !important;pointer-events:none}
.message.align-right{flex-direction:row-reverse}
.message.align-center{justify-content:center}
.message.align-center .message-content{align-items:center}
.message.align-right .message-header{flex-direction:row-reverse}
.message.align-right .message-bubble{border-bottom-left-radius:var(--radius-card);border-bottom-right-radius:3px}
.avatar{width:var(--avatar-size);height:var(--avatar-size);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:calc(var(--font-size)*0.75);font-weight:700;font-family:'Rajdhani','Inter',sans-serif;color:#fff;flex-shrink:0;letter-spacing:0.5px;position:relative;overflow:hidden}
.avatar-pic{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:7px}
.avatar::after{content:'';position:absolute;inset:-2px;border-radius:10px;border:1.5px solid transparent;transition:border-color 0.3s,box-shadow 0.3s;z-index:2;pointer-events:none}
.avatar.ring-broadcaster::after{border-color:var(--broadcaster-color);box-shadow:0 0 8px var(--broadcaster-color)}
.avatar.ring-moderator::after{border-color:var(--mod-color);box-shadow:0 0 8px var(--mod-color)}
.avatar.ring-vip::after{border-color:var(--vip-color);box-shadow:0 0 8px var(--vip-color)}
.avatar.ring-subscriber::after{border-color:var(--sub-color);box-shadow:0 0 8px var(--sub-color)}
.message-content{display:flex;flex-direction:column;gap:0;min-width:0;max-width:calc(100% - var(--avatar-size) - 16px)}
.message-header{display:flex;align-items:center;gap:5px;padding:7px var(--pad-h) 5px;border-bottom:1px solid rgba(255,255,255,0.06)}
.message.align-right .message-header{flex-direction:row-reverse}
.username{font-family:'Rajdhani','Inter',sans-serif;font-size:calc(var(--font-size)*0.88);font-weight:700;letter-spacing:0.6px;text-transform:uppercase;white-space:nowrap}
.badge{display:inline-flex;align-items:center;height:var(--badge-h);min-width:var(--badge-h);padding:0 5px;border-radius:var(--radius-badge);font-size:calc(var(--font-size)*0.6);font-weight:700;font-family:'Rajdhani',sans-serif;border:1px solid transparent;flex-shrink:0;line-height:1;letter-spacing:0.3px}
.message-bubble{background:var(--bg-card);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);border-radius:var(--radius-card);border-bottom-left-radius:3px;padding:0;border:1px solid var(--border-color);box-shadow:0 4px 20px rgba(0,0,0,0.35),0 1px 0 rgba(255,255,255,0.03);word-break:break-word;position:relative;overflow:visible;transition:background 0.2s,box-shadow 0.2s}
.bubble-regular{background:rgba(255,255,255,0.04);border-color:rgba(160,185,235,0.24);box-shadow:0 4px 20px rgba(0,0,0,0.4),0 0 0 1px rgba(255,255,255,0.06) inset}
.bubble-regular .message-header{border-bottom-color:rgba(160,185,235,0.10)}
.bubble-broadcaster{background:rgba(0,200,255,0.08);border-color:rgba(0,200,255,0.26);box-shadow:0 4px 20px rgba(0,0,0,0.35),0 0 14px rgba(0,200,255,0.10)}
.bubble-broadcaster .message-header{border-bottom-color:rgba(0,200,255,0.14)}
.bubble-moderator{background:rgba(0,255,136,0.07);border-color:rgba(0,255,136,0.24);box-shadow:0 4px 20px rgba(0,0,0,0.35),0 0 14px rgba(0,255,136,0.09)}
.bubble-moderator .message-header{border-bottom-color:rgba(0,255,136,0.12)}
.bubble-vip{background:rgba(168,85,247,0.08);border-color:rgba(168,85,247,0.26);box-shadow:0 4px 20px rgba(0,0,0,0.35),0 0 14px rgba(168,85,247,0.10)}
.bubble-vip .message-header{border-bottom-color:rgba(168,85,247,0.14)}
.bubble-subscriber{background:rgba(255,194,0,0.07);border-color:rgba(255,194,0,0.24);box-shadow:0 4px 20px rgba(0,0,0,0.35),0 0 14px rgba(255,194,0,0.09)}
.bubble-subscriber .message-header{border-bottom-color:rgba(255,194,0,0.12)}
.bubble-broadcaster::before,.bubble-moderator::before,.bubble-vip::before,.bubble-subscriber::before{content:'';position:absolute;left:0;top:5px;bottom:5px;width:3px;border-radius:0 2px 2px 0}
.bubble-broadcaster::before{background:var(--broadcaster-color);box-shadow:0 0 8px var(--broadcaster-color)}
.bubble-moderator::before{background:var(--mod-color);box-shadow:0 0 8px var(--mod-color)}
.bubble-vip::before{background:var(--vip-color);box-shadow:0 0 8px var(--vip-color)}
.bubble-subscriber::before{background:var(--sub-color);box-shadow:0 0 8px var(--sub-color)}
.message.align-right .bubble-broadcaster::before,.message.align-right .bubble-moderator::before,.message.align-right .bubble-vip::before,.message.align-right .bubble-subscriber::before{left:auto;right:0;border-radius:2px 0 0 2px}
.message-text{display:block;color:var(--text-primary);font-size:var(--font-size);line-height:1.5;font-family:'Inter',system-ui,sans-serif;padding:6px var(--pad-h) 9px}
.emote-img{height:calc(var(--font-size)*1.7);width:auto;vertical-align:middle;margin:-3px 2px}
.mention{background:rgba(0,200,255,0.15);color:var(--accent-color);border-radius:4px;padding:0 4px;font-weight:600;text-shadow:0 0 8px var(--accent-color)}
.message-bits .message-bubble{background:linear-gradient(135deg,rgba(100,0,200,0.12),rgba(168,85,247,0.12));border-color:rgba(168,85,247,0.38);animation:bitsPulse 2s ease-in-out infinite}
@keyframes bitsPulse{0%,100%{box-shadow:0 4px 20px rgba(0,0,0,0.35)}50%{box-shadow:0 4px 24px rgba(168,85,247,0.45),0 0 20px rgba(168,85,247,0.2)}}
.message-firsttime .message-bubble{border-color:var(--accent-color);box-shadow:0 0 18px rgba(0,200,255,0.28),0 4px 20px rgba(0,0,0,0.35)}
.message-highlighted .message-bubble{background:rgba(0,200,255,0.1);border-color:rgba(0,200,255,0.32)}
.goal-bar{position:fixed;z-index:100;padding:10px 16px;background:var(--bg-card);backdrop-filter:blur(20px) saturate(1.3);-webkit-backdrop-filter:blur(20px) saturate(1.3);border:1px solid var(--border-color);display:none}
.goal-bar.goal-visible{display:block}
.goal-bar.goal-horizontal{left:0;right:0;bottom:0;border-radius:10px 10px 0 0;border-bottom:none}
.goal-bar.goal-vertical{top:0;right:0;bottom:0;width:52px;padding:16px 10px;border-radius:10px 0 0 10px;border-right:none;display:none;flex-direction:column;align-items:center}
.goal-bar.goal-vertical.goal-visible{display:flex}
.goal-inner{display:flex;flex-direction:column;gap:6px;width:100%;height:100%}
.goal-bar.goal-vertical .goal-inner{flex-direction:column-reverse;align-items:center}
.goal-header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.goal-bar.goal-vertical .goal-header{flex-direction:column;align-items:center;gap:4px}
.goal-title{font-family:'Rajdhani','Inter',sans-serif;font-size:calc(var(--font-size)*0.8);font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--text-secondary)}
.goal-values{font-family:'Rajdhani','Inter',sans-serif;font-size:calc(var(--font-size)*0.85);font-weight:600;color:var(--text-primary);white-space:nowrap}
.goal-sep{color:var(--text-secondary)}
.goal-track{width:100%;height:8px;background:rgba(255,255,255,0.07);border-radius:4px;overflow:visible;position:relative}
.goal-bar.goal-vertical .goal-track{width:14px;height:100%;flex:1;border-radius:7px;overflow:hidden}
.goal-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent-color),color-mix(in srgb,var(--accent-color) 65%,#fff));border-radius:4px;transition:width 1s var(--power);position:relative;overflow:hidden;box-shadow:0 0 10px var(--accent-color)}
.goal-bar.goal-vertical .goal-fill{width:100%;height:0%;position:absolute;bottom:0;background:linear-gradient(0deg,var(--accent-color),color-mix(in srgb,var(--accent-color) 65%,#fff));transition:height 1s var(--power);box-shadow:0 0 10px var(--accent-color);border-radius:7px}
.goal-fill::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 20%,rgba(255,255,255,0.35) 50%,transparent 80%);animation:goalScan 2s ease-in-out infinite}
@keyframes goalScan{0%{transform:translateX(-120%);opacity:0}40%{opacity:1}100%{transform:translateX(120%);opacity:0}}
.goal-percent{font-family:'Rajdhani','Inter',sans-serif;font-size:calc(var(--font-size)*0.78);font-weight:700;color:var(--accent-color);text-shadow:0 0 8px var(--accent-color);text-align:right;white-space:nowrap}
.goal-bar.goal-vertical .goal-percent{writing-mode:vertical-rl;text-orientation:mixed;transform:rotate(180deg);font-size:calc(var(--font-size)*0.72);text-align:center}
#alert-overlay{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999}
#alert-container{display:flex;flex-direction:column;gap:10px;align-items:center;width:88%;max-width:480px}
.alert-card{width:100%;background:var(--bg-card);backdrop-filter:blur(32px) saturate(1.5);-webkit-backdrop-filter:blur(32px) saturate(1.5);border-radius:12px;padding:16px 20px;border:1px solid rgba(255,255,255,0.1);box-shadow:0 20px 60px rgba(0,0,0,0.6),0 0 0 0.5px rgba(255,255,255,0.04);display:flex;align-items:center;gap:14px;opacity:0;transform:scale(0.84) translateY(-18px);transition:opacity 0.45s var(--spring),transform 0.45s var(--spring);position:relative;overflow:hidden}
.alert-card.visible{opacity:1;transform:scale(1) translateY(0)}
.alert-card.hiding{opacity:0;transform:scale(0.92) translateY(-10px);transition:opacity 0.35s ease,transform 0.35s ease}
.alert-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:12px 12px 0 0}
.alert-follow::before{background:linear-gradient(90deg,var(--accent-color),var(--neon-teal));box-shadow:0 0 12px var(--accent-color)}
.alert-sub::before{background:linear-gradient(90deg,var(--sub-color),var(--neon-yellow));box-shadow:0 0 12px var(--sub-color)}
.alert-giftsub::before{background:linear-gradient(90deg,var(--vip-color),var(--neon-pink));box-shadow:0 0 12px var(--vip-color)}
.alert-bits::before{background:linear-gradient(90deg,var(--neon-purple),var(--neon-blue));box-shadow:0 0 12px var(--neon-purple)}
.alert-donation::before{background:linear-gradient(90deg,var(--neon-green),var(--neon-teal));box-shadow:0 0 12px var(--neon-green)}
.alert-raid::before{background:linear-gradient(90deg,var(--neon-red),var(--neon-orange));box-shadow:0 0 12px var(--neon-red)}
.alert-host::before{background:linear-gradient(90deg,var(--neon-orange),var(--neon-yellow));box-shadow:0 0 12px var(--neon-orange)}
.alert-card::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,0.04) 50%,transparent 65%);animation:alertScan 2.5s ease-in-out infinite;pointer-events:none}
@keyframes alertScan{0%{transform:translateX(-110%)}100%{transform:translateX(110%)}}
.alert-icon{font-size:2.2em;flex-shrink:0;animation:iconPop 0.5s var(--spring) 0.1s both;z-index:1;filter:drop-shadow(0 0 6px rgba(255,255,255,0.25))}
@keyframes iconPop{from{transform:scale(0) rotate(-18deg)}to{transform:scale(1) rotate(0deg)}}
.alert-content{flex:1;min-width:0;z-index:1}
.alert-title{font-family:'Rajdhani','Inter',sans-serif;font-size:calc(var(--font-size)*0.75);font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:3px}
.alert-message{font-size:calc(var(--font-size)*1.05);font-weight:600;color:var(--text-primary);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
[data-theme="light"] .message-bubble{border-color:rgba(0,0,0,0.08);box-shadow:0 2px 14px rgba(0,0,0,0.08)}
[data-theme="light"] .message-header{border-bottom-color:rgba(0,0,0,0.06)}
[data-theme="light"] .bubble-regular{background:rgba(0,0,0,0.025);border-color:rgba(0,0,0,0.10)}
[data-theme="light"] .bubble-regular .message-header{border-bottom-color:rgba(0,0,0,0.05)}
[data-theme="light"] .alert-card{border-color:rgba(0,0,0,0.09);box-shadow:0 20px 60px rgba(0,0,0,0.15)}
[data-theme="light"] .goal-track{background:rgba(0,0,0,0.08)}
  </script>

  <!-- ══ Widget JS ══ -->
  <script type="text/plain" id="widget-js">
'use strict';
let cfg={fontSize:14,chatWidth:100,alignment:'left',perspectiveX:0,perspectiveY:0,theme:'dark',accentColor:'#00c8ff',backgroundOpacity:88,showBadges:true,showAvatars:true,maxMessages:12,messageAnimation:'spring',showAlerts:true,alertDuration:5,modColor:'#00ff88',vipColor:'#a855f7',subColor:'#ffc200',showGoal:false,goalType:'followers',goalTitle:'Objectif du stream',goalCurrent:0,goalTarget:100,goalOrientation:'horizontal',goalColor:'#00c8ff',goalAutoTrack:true};
const alertQueue=[];let alertBusy=false,goalAutoCount=0;
window.addEventListener('onWidgetLoad',(obj)=>{const fields=obj.detail.fieldData;cfg={...cfg,...fields};applyConfig();applyGoal()});
window.addEventListener('onEventReceived',(obj)=>{const listener=obj.detail.listener,event=obj.detail.event;if(listener==='message'){addMessage(event.data);return}if(cfg.showAlerts)enqueueAlert(listener,event);if(cfg.showGoal&&cfg.goalAutoTrack)trackGoalEvent(listener,event)});
function applyConfig(){const root=document.documentElement,container=document.getElementById('chat-container'),messages=document.getElementById('chat-messages');root.style.setProperty('--font-size',cfg.fontSize+'px');root.style.setProperty('--bg-opacity',(cfg.backgroundOpacity/100).toFixed(2));root.style.setProperty('--accent-color',cfg.accentColor);root.style.setProperty('--mod-color',cfg.modColor);root.style.setProperty('--vip-color',cfg.vipColor);root.style.setProperty('--sub-color',cfg.subColor);container.style.width=cfg.chatWidth+'%';const alignMap={left:'flex-start',right:'flex-end',center:'center'};messages.style.alignItems=alignMap[cfg.alignment]||'flex-start';root.setAttribute('data-theme',cfg.theme);root.setAttribute('data-animation',cfg.messageAnimation);const px=parseFloat(cfg.perspectiveX)||0,py=parseFloat(cfg.perspectiveY)||0;container.style.transform=(px||py)?`rotateX(${px}deg) rotateY(${py}deg)`:'';}
function applyGoal(){const bar=document.getElementById('goal-bar'),wrapper=document.getElementById('chat-wrapper');if(!bar)return;if(!cfg.showGoal){bar.classList.remove('goal-visible');if(wrapper){wrapper.style.paddingBottom='';wrapper.style.paddingRight='';}return}bar.className=`goal-bar goal-${cfg.goalOrientation}`;bar.classList.add('goal-visible');document.documentElement.style.setProperty('--accent-color',cfg.goalColor||cfg.accentColor);const titleEl=document.getElementById('goal-title');if(titleEl)titleEl.textContent=cfg.goalTitle||'Objectif';goalAutoCount=parseFloat(cfg.goalCurrent)||0;updateGoalProgress(goalAutoCount,cfg.goalTarget);if(wrapper){requestAnimationFrame(()=>{if(cfg.goalOrientation==='horizontal'){wrapper.style.paddingBottom=bar.offsetHeight+'px';wrapper.style.paddingRight='';}else{wrapper.style.paddingRight=bar.offsetWidth+'px';wrapper.style.paddingBottom='';}});}}
function updateGoalProgress(current,target){const cur=Math.max(0,parseFloat(current)||0),tgt=Math.max(1,parseFloat(target)||100),pct=Math.min(100,(cur/tgt)*100);const curEl=document.getElementById('goal-current'),tgtEl=document.getElementById('goal-target'),pctEl=document.getElementById('goal-percent'),fillEl=document.getElementById('goal-fill'),barEl=document.getElementById('goal-bar');if(curEl)curEl.textContent=Math.floor(cur).toLocaleString();if(tgtEl)tgtEl.textContent=Math.floor(tgt).toLocaleString();if(pctEl)pctEl.textContent=Math.round(pct)+'%';if(fillEl&&barEl){if(barEl.classList.contains('goal-vertical')){fillEl.style.height=pct+'%';fillEl.style.width='100%'}else{fillEl.style.width=pct+'%';fillEl.style.height='100%'}}}
function trackGoalEvent(listener,event){const type=cfg.goalType;if(type==='followers'&&listener==='follower-latest'){goalAutoCount++;updateGoalProgress(goalAutoCount,cfg.goalTarget)}else if(type==='subs'&&listener==='subscriber-latest'){goalAutoCount+=(event.bulkGifted?(event.amount||1):1);updateGoalProgress(goalAutoCount,cfg.goalTarget)}else if(type==='bits'&&listener==='cheer-latest'){goalAutoCount+=parseFloat(event.amount)||0;updateGoalProgress(goalAutoCount,cfg.goalTarget)}else if(type==='donations'&&listener==='tip-latest'){goalAutoCount+=parseFloat(event.amount)||0;updateGoalProgress(goalAutoCount,cfg.goalTarget)}}
function addMessage(data){if(!data)return;const messagesEl=document.getElementById('chat-messages'),role=detectRole(data.badges),color=data.color||roleColor(role);let extraClass='';if(data.tags&&data.tags['msg-id']==='highlighted-message')extraClass='message-highlighted';if(data.tags&&data.tags['first-msg']==='1')extraClass='message-firsttime';if(data.tags&&data.tags['bits'])extraClass='message-bits';const el=document.createElement('div');el.className=['message',`message-${role}`,`align-${cfg.alignment}`,extraClass].filter(Boolean).join(' ');el.innerHTML=buildMessageHTML(data,role,color);messagesEl.appendChild(el);requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('visible')));pruneMessages(messagesEl)}
function buildMessageHTML(data,role,color){const avatarHTML=cfg.showAvatars?buildAvatar(data,role,color):'',badgesHTML=cfg.showBadges?buildBadges(data.badges,role):'',msgHTML=buildText(data.text||'',data.emotes||'',data.userId||''),username=escapeHTML(data.displayName||data.userName||'Anonyme'),glow=`text-shadow:0 0 10px ${color}70`;return`${avatarHTML}<div class="message-content"><div class="message-bubble bubble-${role}"><div class="message-header">${badgesHTML}<span class="username" style="color:${color};${glow}">${username}</span></div><span class="message-text">${msgHTML}</span></div></div>`}
function buildAvatar(data,role,color){const ring=role!=='regular'?` ring-${role}`:'',bg=hexToRgba(color,0.30),brd=hexToRgba(color,0.60),styleStr=role!=='regular'?`background:${bg}`:`background:${bg};border:1.5px solid ${brd}`;if(data.avatar){const src=String(data.avatar).replace(/"/g,'');return`<div class="avatar${ring}" style="${styleStr}"><img class="avatar-pic" src="${src}" alt="" loading="lazy" onerror="this.style.display='none'"></div>`}const initials=(data.displayName||data.userName||'??').substring(0,2).toUpperCase();return`<div class="avatar${ring}" style="${styleStr}">${initials}</div>`}
function hexToRgba(hex,alpha){if(!hex||!hex.startsWith('#'))return`rgba(120,120,180,${alpha})`;const h=hex.replace('#',''),r=parseInt(h.substring(0,2),16)||0,g=parseInt(h.substring(2,4),16)||0,b=parseInt(h.substring(4,6),16)||0;return`rgba(${r},${g},${b},${alpha})`}
function buildBadges(badges,role){const badgeData=parseBadges(badges);if(!badgeData.length)return'';const icons={broadcaster:'📡',moderator:'🛡️',vip:'💎',subscriber:'⭐',partner:'✓',turbo:'⚡',premium:'👑',staff:'⚙️',admin:'🔑'};return badgeData.map(b=>{const icon=icons[b.type]||'•',c=roleBadgeColor(b.type);return`<span class="badge badge-${b.type}" style="background:${c}22;border-color:${c}44;color:${c}">${icon}</span>`}).join('')}
function parseBadges(raw){if(!raw)return[];if(Array.isArray(raw))return raw;return String(raw).split(',').map(s=>{const[type]=s.split('/');return{type}}).filter(b=>b.type)}
function buildText(text,emotesRaw,userId){let safe=escapeHTML(text);if(emotesRaw&&typeof emotesRaw==='string'&&emotesRaw.length)safe=renderEmotes(text,emotesRaw);else if(emotesRaw&&typeof emotesRaw==='object')safe=renderEmotesObj(text,emotesRaw);return safe.replace(/@(\w+)/g,(_,name)=>`<span class="mention">@${name}</span>`)}
function renderEmotes(text,emotesStr){const replacements=[];emotesStr.split('/').forEach(entry=>{const[id,positions]=entry.split(':');if(!positions)return;positions.split(',').forEach(pos=>{const[start,end]=pos.split('-').map(Number);replacements.push({start,end:end+1,img:emoteImg(id)})})});replacements.sort((a,b)=>b.start-a.start);const chars=[...text];replacements.forEach(({start,end,img})=>chars.splice(start,end-start,img));return chars.join('')}
function renderEmotesObj(text,emotesObj){const replacements=[];for(const[id,positions]of Object.entries(emotesObj)){const posArr=Array.isArray(positions)?positions:[positions];posArr.forEach(pos=>{const[start,end]=(typeof pos==='string'?pos:`${pos.start}-${pos.end}`).split('-').map(Number);replacements.push({start,end:end+1,img:emoteImg(id)})})}replacements.sort((a,b)=>b.start-a.start);const chars=[...text];replacements.forEach(({start,end,img})=>chars.splice(start,end-start,img));return chars.join('')}
function emoteImg(id){return`<img class="emote-img" src="https://static-cdn.jtvnw.net/emoticons/v2/${id}/default/dark/2.0" alt="" loading="lazy">`}
function detectRole(badges){const list=parseBadges(badges),priority=['broadcaster','moderator','vip','subscriber','partner'];for(const p of priority)if(list.some(b=>b.type===p))return p;return'regular'}
function roleColor(role){switch(role){case'broadcaster':return cfg.broadcasterColor||'#00c8ff';case'moderator':return cfg.modColor||'#00ff88';case'vip':return cfg.vipColor||'#a855f7';case'subscriber':return cfg.subColor||'#ffc200';case'partner':return'#9146FF';default:return cfg.accentColor||'#00c8ff'}}
function roleBadgeColor(type){switch(type){case'broadcaster':return cfg.broadcasterColor||'#00c8ff';case'moderator':return cfg.modColor||'#00ff88';case'vip':return cfg.vipColor||'#a855f7';case'subscriber':return cfg.subColor||'#ffc200';case'partner':return'#9146FF';case'turbo':return'#7B68EE';case'premium':return'#FFD700';case'staff':return'#00A8FF';case'admin':return'#FF4500';default:return cfg.accentColor||'#00c8ff'}}
function pruneMessages(container){const all=container.querySelectorAll('.message:not(.removing)'),max=parseInt(cfg.maxMessages)||12;if(all.length<=max)return;const excess=all.length-max;for(let i=0;i<excess;i++){const el=all[i];el.classList.add('removing');setTimeout(()=>el.remove(),350)}}
function enqueueAlert(listener,event){alertQueue.push({listener,event});if(!alertBusy)drainAlertQueue()}
function drainAlertQueue(){if(!alertQueue.length){alertBusy=false;return}alertBusy=true;const{listener,event}=alertQueue.shift();displayAlert(listener,event)}
function displayAlert(listener,event){const config=buildAlertConfig(listener,event);if(!config){drainAlertQueue();return}const container=document.getElementById('alert-container'),card=document.createElement('div');card.className=`alert-card alert-${config.type}`;card.innerHTML=`<div class="alert-icon">${config.icon}</div><div class="alert-content"><div class="alert-title">${escapeHTML(config.title)}</div><div class="alert-message">${escapeHTML(config.message)}</div></div>`;container.appendChild(card);requestAnimationFrame(()=>requestAnimationFrame(()=>card.classList.add('visible')));const duration=(parseFloat(cfg.alertDuration)||5)*1000;setTimeout(()=>{card.classList.add('hiding');setTimeout(()=>{card.remove();drainAlertQueue()},450)},duration)}
function buildAlertConfig(listener,event){const name=event.name||event.displayName||event.sender||"Quelqu'un",amount=event.amount||event.count||'',months=event.months||'',msg=event.message?` — "${event.message}"`:''  ,gifter=event.sender||event.gifterDisplayName||'';switch(listener){case'follower-latest':return{type:'follow',icon:'💙',title:'Nouveau Suiveur !',message:`${name} suit maintenant la chaîne !`};case'subscriber-latest':if(event.bulkGifted)return{type:'giftsub',icon:'🎁',title:`${amount} Abonnements Offerts !`,message:`${name} offre ${amount} abonnements à la communauté !`};if(event.gifted)return{type:'giftsub',icon:'🎁',title:'Cadeau Abonnement !',message:`${gifter} offre un abonnement à ${name} !`};return{type:'sub',icon:'⭐',title:months>1?`${months} mois d'abonnement !`:'Nouvel Abonné !',message:months>1?`${name} est abonné depuis ${months} mois !${msg}`:`${name} vient de s'abonner !${msg}`};case'cheer-latest':return{type:'bits',icon:'💎',title:`${amount} Bits !`,message:`${name} envoie ${amount} bits !${msg}`};case'tip-latest':return{type:'donation',icon:'💰',title:`Don de ${amount}€ !`,message:`${name} a fait un don de ${amount}€ !${msg}`};case'raid-latest':return{type:'raid',icon:'⚔️',title:'RAID INCOMING !',message:`${name} arrive avec ${amount} raiders !`};case'host-latest':return{type:'host',icon:'📡',title:'Host !',message:`${name} host la chaîne avec ${amount} viewers !`};default:return null}}
function escapeHTML(str){if(typeof str!=='string')return String(str||'');return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
  </script>

<body>

  <!-- ══ Barre de contrôle ══ -->
  <div class="preview-bar">
    <h1>🎮 Gamer Chat</h1>

    <span class="status-badge"><span class="status-dot"></span>Live Preview</span>

    <div class="sep"></div>

    <span class="section-label">Style</span>

    <div class="ctrl-group">
      <label>Thème</label>
      <select id="ctrl-theme" onchange="updateWidget()">
        <option value="dark" selected>🌑 Gamer Dark</option>
        <option value="light">☀️ Clair</option>
        <option value="amoled">⬛ AMOLED</option>
      </select>
    </div>

    <div class="ctrl-group">
      <label>Animation</label>
      <select id="ctrl-anim" onchange="updateWidget()">
        <option value="spring" selected>⚡ Ressort</option>
        <option value="slide">➡️ Glissement</option>
        <option value="fade">🌫️ Fondu</option>
        <option value="none">✖ Aucune</option>
      </select>
    </div>

    <div class="ctrl-group">
      <label>Alignement</label>
      <select id="ctrl-align" onchange="updateWidget()">
        <option value="left" selected>⬅ Gauche</option>
        <option value="right">➡ Droite</option>
        <option value="center">↔ Centre</option>
      </select>
    </div>

    <div class="ctrl-group">
      <label>Police</label>
      <input type="range" id="ctrl-font" min="10" max="24" value="14" oninput="updateWidget()">
    </div>

    <div class="ctrl-group">
      <label>Opacité</label>
      <input type="range" id="ctrl-opacity" min="0" max="100" value="88" oninput="updateWidget()">
    </div>

    <div class="ctrl-group">
      <label>Accent</label>
      <input type="color" id="ctrl-accent" value="#00c8ff" oninput="updateWidget()">
    </div>

    <div class="ctrl-group">
      <label>Rot X</label>
      <input type="range" id="ctrl-rotx" min="-45" max="45" value="0" oninput="updateWidget(); document.getElementById('lbl-rotx').textContent=this.value+'°'">
      <span id="lbl-rotx" style="color:rgba(165,185,215,0.6);font-size:10px;min-width:26px">0°</span>
    </div>

    <div class="ctrl-group">
      <label>Rot Y</label>
      <input type="range" id="ctrl-roty" min="-45" max="45" value="0" oninput="updateWidget(); document.getElementById('lbl-roty').textContent=this.value+'°'">
      <span id="lbl-roty" style="color:rgba(165,185,215,0.6);font-size:10px;min-width:26px">0°</span>
    </div>

    <div class="sep"></div>

    <span class="section-label">Messages</span>

    <button class="btn" onclick="sendMsg('regular')">Chat</button>
    <button class="btn green" onclick="sendMsg('moderator')">🛡️ Mod</button>
    <button class="btn purple" onclick="sendMsg('vip')">💎 VIP</button>
    <button class="btn orange" onclick="sendMsg('subscriber')">⭐ Sub</button>
    <button class="btn" onclick="sendMsg('broadcaster')">📡 Live</button>

    <div class="sep"></div>

    <span class="section-label">Alertes</span>

    <button class="btn dark" onclick="sendAlert('follow')">💙 Follow</button>
    <button class="btn orange" onclick="sendAlert('sub')">⭐ Sub</button>
    <button class="btn red" onclick="sendAlert('raid')">⚔️ Raid</button>
    <button class="btn purple" onclick="sendAlert('bits')">💎 Bits</button>
    <button class="btn green" onclick="sendAlert('donation')">💰 Don</button>

    <div class="sep"></div>

    <span class="section-label">Goal</span>

    <div class="ctrl-group">
      <label>Afficher</label>
      <input type="checkbox" id="ctrl-goal-show" onchange="updateGoalPreview()">
    </div>
    <div class="ctrl-group">
      <label>Orientation</label>
      <select id="ctrl-goal-orient" onchange="updateGoalPreview()">
        <option value="horizontal">─ Horiz.</option>
        <option value="vertical">│ Vert.</option>
      </select>
    </div>
    <div class="ctrl-group">
      <label>Titre</label>
      <input type="text" id="ctrl-goal-title" value="Objectif du stream" oninput="updateGoalPreview()">
    </div>
    <div class="ctrl-group">
      <label>Actuel</label>
      <input type="number" id="ctrl-goal-cur" value="0" min="0" oninput="updateGoalPreview()">
    </div>
    <div class="ctrl-group">
      <label>Cible</label>
      <input type="number" id="ctrl-goal-tgt" value="100" min="1" oninput="updateGoalPreview()">
    </div>
    <div class="ctrl-group">
      <label>Couleur</label>
      <input type="color" id="ctrl-goal-color" value="#00c8ff" oninput="updateGoalPreview()">
    </div>

    <div class="sep"></div>

    <button class="btn green" id="btn-auto" onclick="toggleAuto()">▶ Auto-Demo</button>
  </div>

  <!-- ══ Preview Stage ══ -->
  <div class="preview-stage">
    <div class="corner-tl"></div>
    <div class="corner-tr"></div>
    <div class="corner-bl"></div>
    <div class="corner-br"></div>
    <iframe id="widget-frame"></iframe>
  </div>

  <!-- ══ JavaScript du preview ══ -->
  <script>
    // ─── Retrieve stored widget code ──────────────────────────
    const widgetHTML = document.getElementById('widget-html').textContent;
    const widgetCSS  = document.getElementById('widget-css').textContent;
    const widgetJS   = document.getElementById('widget-js').textContent;

    let autoMode = false;
    let autoTimer = null;

    // ─── Build & inject the iframe ────────────────────────────
    function buildIframeSrcdoc(overrideFields = {}) {
      const fields = {
        fontSize:          parseInt(document.getElementById('ctrl-font').value),
        theme:             document.getElementById('ctrl-theme').value,
        messageAnimation:  document.getElementById('ctrl-anim').value,
        alignment:         document.getElementById('ctrl-align').value,
        backgroundOpacity: parseInt(document.getElementById('ctrl-opacity').value),
        accentColor:       document.getElementById('ctrl-accent').value,
        showBadges:        true,
        showAvatars:       true,
        maxMessages:       12,
        showAlerts:        true,
        alertDuration:     5,
        modColor:          '#00ff88',
        vipColor:          '#a855f7',
        subColor:          '#ffc200',
        perspectiveX:      parseInt(document.getElementById('ctrl-rotx').value),
        perspectiveY:      parseInt(document.getElementById('ctrl-roty').value),
        chatWidth:         100,
        showGoal:          document.getElementById('ctrl-goal-show').checked,
        goalTitle:         document.getElementById('ctrl-goal-title').value,
        goalCurrent:       parseFloat(document.getElementById('ctrl-goal-cur').value) || 0,
        goalTarget:        parseFloat(document.getElementById('ctrl-goal-tgt').value) || 100,
        goalOrientation:   document.getElementById('ctrl-goal-orient').value,
        goalColor:         document.getElementById('ctrl-goal-color').value,
        goalAutoTrack:     true,
        ...overrideFields
      };

      return `<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>${widgetCSS}</style>
</head>
<body>
${widgetHTML}
<script>
${widgetJS}
// Override widget defaults with preview config
Object.assign(cfg, ${JSON.stringify(fields)});
goalAutoCount = cfg.goalCurrent || 0;
applyConfig();
applyGoal();
<\/script>
</body>
</html>`;
    }

    // ─── Inject into iframe ───────────────────────────────────
    function updateWidget() {
      const frame = document.getElementById('widget-frame');
      frame.srcdoc = buildIframeSrcdoc();
    }

    // ─── Update goal without rebuilding ──────────────────────
    function updateGoalPreview() {
      updateWidget();
    }

    // ─── Send message to iframe ───────────────────────────────
    // Avatar placeholders — consistent per username seed
    const avatarUrl = name =>
      `https://api.dicebear.com/9.x/pixel-art/svg?seed=${encodeURIComponent(name)}&backgroundColor=0a0e1a,101428,0d1020`;

    const names = {
      regular:     ['Tyler', 'Zoe', 'Emma', 'Chris', 'Lily', 'Alex', 'Sam'],
      moderator:   ['ModKevin', 'SentinelX'],
      vip:         ['VipQueen', 'DiamondAlex'],
      subscriber:  ['SubHero', 'LoyalFan99'],
      broadcaster: ['StreamerPro']
    };

    const messages = [
      'PogChamp quel stream !',
      'Chat moving so fast!',
      'Solid stream as always 🔥',
      'GG les gars !',
      'This overlay is fire',
      'What mic are you using?',
      'Let\'s go ! 💯',
      'hype hype hype !!!',
      '@Streamer incroyable le play !',
      'Kappa Kappa'
    ];

    function sendMsg(role) {
      const nameList = names[role] || names.regular;
      const name     = nameList[Math.floor(Math.random() * nameList.length)];
      const text     = messages[Math.floor(Math.random() * messages.length)];

      const badgeMap = {
        broadcaster: 'broadcaster/1',
        moderator:   'moderator/1',
        vip:         'vip/1',
        subscriber:  'subscriber/12'
      };

      const colors = {
        regular: ['#FF6B6B','#4ECDC4','#45B7D1','#96CEB4','#DDA0DD','#87CEEB','#F0A500'],
        moderator: ['#00ff88','#00cc70'],
        vip: ['#a855f7','#9333ea'],
        subscriber: ['#ffc200','#ffb000'],
        broadcaster: ['#00c8ff']
      };
      const colorList = colors[role] || colors.regular;
      const userColor = colorList[Math.floor(Math.random() * colorList.length)];

      const event = {
        listener: 'message',
        event: { data: {
          displayName: name,
          text:        text,
          color:       userColor,
          avatar:      avatarUrl(name),
          badges:      badgeMap[role] || '',
          emotes:      '',
          userId:      Math.random().toString(36).slice(2),
          tags:        {}
        }}
      };

      injectEvent(event);
    }

    // ─── Send alert to iframe ─────────────────────────────────
    const alertDefs = {
      follow:   () => ({ listener:'follower-latest',  event:{ name:'RaidLeader' } }),
      sub:      () => ({ listener:'subscriber-latest',event:{ name:'Emma', months:3, message:'GG !' } }),
      raid:     () => ({ listener:'raid-latest',       event:{ name:'RaidLeader', amount:50 } }),
      bits:     () => ({ listener:'cheer-latest',      event:{ name:'Chris', amount:500, message:'PogChamp' } }),
      donation: () => ({ listener:'tip-latest',        event:{ name:'Lily', amount:'5.00', message:'Super stream !' } }),
      giftsub:  () => ({ listener:'subscriber-latest', event:{ name:'Ryan', gifted:true, sender:'AnonymousGifter' } })
    };

    function sendAlert(type) {
      const def = alertDefs[type];
      if (!def) return;
      injectEvent({ ...def(), _isAlert: true });
    }

    // ─── Inject event into iframe ─────────────────────────────
    function injectEvent(payload) {
      const frame = document.getElementById('widget-frame');
      if (!frame.contentWindow) return;

      frame.contentWindow.dispatchEvent(
        new CustomEvent(payload.listener === 'message' ? 'onEventReceived' : 'onEventReceived', {
          detail: payload
        })
      );
    }

    // ─── Auto-demo mode ───────────────────────────────────────
    const autoEvents = [
      () => sendMsg('regular'),
      () => sendMsg('regular'),
      () => sendMsg('subscriber'),
      () => sendMsg('moderator'),
      () => sendMsg('vip'),
      () => sendMsg('regular'),
      () => sendMsg('regular'),
      () => sendAlert('follow'),
      () => sendMsg('regular'),
      () => sendAlert('bits'),
      () => sendMsg('broadcaster'),
      () => sendAlert('sub'),
      () => sendMsg('regular'),
      () => sendAlert('raid'),
    ];
    let autoIdx = 0;

    function toggleAuto() {
      autoMode = !autoMode;
      const btn = document.getElementById('btn-auto');
      if (autoMode) {
        btn.textContent = '⏹ Stop Demo';
        btn.className = 'btn red';
        runAuto();
      } else {
        clearTimeout(autoTimer);
        btn.textContent = '▶ Auto-Demo';
        btn.className = 'btn green';
      }
    }

    function runAuto() {
      if (!autoMode) return;
      autoEvents[autoIdx % autoEvents.length]();
      autoIdx++;
      const delay = 1600 + Math.random() * 800;
      autoTimer = setTimeout(runAuto, delay);
    }

    // ─── Init on load ─────────────────────────────────────────
    window.addEventListener('load', () => {
      updateWidget();
    });
  </script>

</body>
</html>
