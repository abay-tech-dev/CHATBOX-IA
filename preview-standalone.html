<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍎 Apple Chat Overlay — Preview</title>

  <!-- ══ CSS de la barre de contrôle (preview shell) ══ -->
  <style>
    body {
      margin: 0;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    }
    .preview-bar {
      width: 100%;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(20px);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      z-index: 100;
      position: sticky;
      top: 0;
    }
    .preview-bar h1 {
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.3px;
      flex-shrink: 0;
    }
    .sep { width: 1px; height: 24px; background: rgba(255,255,255,0.15); flex-shrink: 0; }
    .ctrl-group { display: flex; align-items: center; gap: 5px; }
    .ctrl-group label {
      color: rgba(255,255,255,0.55);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    .ctrl-group select,
    .ctrl-group input[type="range"] {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.18);
      color: #fff;
      border-radius: 7px;
      padding: 3px 7px;
      font-size: 12px;
      cursor: pointer;
      outline: none;
    }
    .ctrl-group input[type="range"] { width: 72px; accent-color: #007AFF; }
    .ctrl-group input[type="color"] {
      width: 30px; height: 26px; padding: 2px;
      border-radius: 6px; border: 1px solid rgba(255,255,255,0.18);
      background: none; cursor: pointer;
    }
    .btn {
      background: #007AFF; color: #fff;
      border: none; border-radius: 8px;
      padding: 5px 11px; font-size: 11px; font-weight: 700;
      cursor: pointer; white-space: nowrap;
      transition: opacity 0.15s ease, transform 0.1s ease;
    }
    .btn:active { transform: scale(0.94); opacity: 0.8; }
    .btn.red    { background: #FF453A; }
    .btn.purple { background: #BF5AF2; }
    .btn.green  { background: #34C759; }
    .btn.orange { background: #FF9F0A; }
    .btn.dark   { background: rgba(255,255,255,0.12); }

    .preview-stage {
      position: relative;
      width: 460px;
      height: 620px;
      margin: 28px auto 40px;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 32px 80px rgba(0,0,0,0.65), 0 0 0 1px rgba(255,255,255,0.08);
    }
    .iphone-frame {
      position: absolute;
      inset: 0;
      border: 1.5px solid rgba(255,255,255,0.14);
      border-radius: 22px;
      pointer-events: none;
      z-index: 50;
    }
    iframe {
      width: 100%; height: 100%;
      border: none; background: transparent;
    }
    .range-val {
      color: rgba(255,255,255,0.5);
      font-size: 10px;
      min-width: 24px;
      text-align: left;
    }
  </style>
</head>

<body>

<!-- ══ Barre de contrôles ══ -->
<div class="preview-bar">
  <h1>🍎 Apple Chat Overlay</h1>
  <div class="sep"></div>

  <div class="ctrl-group">
    <label>Thème</label>
    <select id="ctrl-theme" onchange="rebuild()">
      <option value="dark">Sombre</option>
      <option value="light">Clair</option>
      <option value="amoled">AMOLED</option>
    </select>
  </div>

  <div class="ctrl-group">
    <label>Anim.</label>
    <select id="ctrl-anim" onchange="rebuild()">
      <option value="spring">Ressort</option>
      <option value="slide">Glissement</option>
      <option value="fade">Fondu</option>
      <option value="none">Aucune</option>
    </select>
  </div>

  <div class="ctrl-group">
    <label>Align.</label>
    <select id="ctrl-align" onchange="rebuild()">
      <option value="left">Gauche</option>
      <option value="right">Droite</option>
      <option value="center">Centre</option>
    </select>
  </div>

  <div class="sep"></div>

  <div class="ctrl-group">
    <label>Taille</label>
    <input type="range" id="ctrl-size" min="10" max="22" value="15"
           oninput="document.getElementById('v-size').textContent=this.value+'px';rebuild()">
    <span class="range-val" id="v-size">15px</span>
  </div>

  <div class="ctrl-group">
    <label>Rot X</label>
    <input type="range" id="ctrl-rx" min="-35" max="35" value="0"
           oninput="document.getElementById('v-rx').textContent=this.value+'°';rebuild()">
    <span class="range-val" id="v-rx">0°</span>
  </div>

  <div class="ctrl-group">
    <label>Rot Y</label>
    <input type="range" id="ctrl-ry" min="-35" max="35" value="0"
           oninput="document.getElementById('v-ry').textContent=this.value+'°';rebuild()">
    <span class="range-val" id="v-ry">0°</span>
  </div>

  <div class="ctrl-group">
    <label>Opacité</label>
    <input type="range" id="ctrl-opacity" min="0" max="100" value="80"
           oninput="document.getElementById('v-op').textContent=this.value+'%';rebuild()">
    <span class="range-val" id="v-op">80%</span>
  </div>

  <div class="ctrl-group">
    <label>Accent</label>
    <input type="color" id="ctrl-accent" value="#007AFF" oninput="rebuild()">
  </div>

  <div class="sep"></div>

  <button class="btn dark"   onclick="send('regular')">💬 Chat</button>
  <button class="btn green"  onclick="send('moderator')">🛡️ Mod</button>
  <button class="btn purple" onclick="send('vip')">💎 VIP</button>
  <button class="btn orange" onclick="send('subscriber')">⭐ Sub</button>
  <button class="btn red"    onclick="send('broadcaster')">📡 Live</button>

  <div class="sep"></div>

  <button class="btn"        onclick="alert_('follower-latest')">Follow</button>
  <button class="btn orange" onclick="alert_('subscriber-latest')">Sub</button>
  <button class="btn red"    onclick="alert_('raid-latest')">Raid</button>
  <button class="btn purple" onclick="alert_('cheer-latest')">Bits</button>
  <button class="btn green"  onclick="alert_('tip-latest')">Don</button>
</div>

<!-- ══ Scène de prévisualisation ══ -->
<div class="preview-stage">
  <div class="iphone-frame"></div>
  <iframe id="wf" title="Widget Preview"></iframe>
</div>

<script type="text/plain" id="w-css">
/* ============================================================
   Apple iOS Chat Overlay — StreamElements Widget
   Design System: iOS 17 / macOS Sonoma
   ============================================================ */

* {
  margin: 0; padding: 0; box-sizing: border-box;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
:root {
  --sys-blue:#007AFF;--sys-green:#34C759;--sys-red:#FF453A;
  --sys-yellow:#FFD60A;--sys-orange:#FF9F0A;--sys-pink:#FF375F;
  --sys-purple:#BF5AF2;--sys-teal:#5AC8FA;--sys-indigo:#5856D6;
  --accent-color:#007AFF;--font-size:15px;--bg-opacity:0.8;
  --mod-color:#34C759;--vip-color:#BF5AF2;--sub-color:#FF9F0A;
  --broadcaster-color:#FF453A;
  --bg-primary:rgba(28,28,30,var(--bg-opacity));
  --bg-secondary:rgba(44,44,46,0.92);--bg-tertiary:rgba(58,58,60,0.92);
  --text-primary:rgba(255,255,255,1);--text-secondary:rgba(235,235,245,0.6);
  --separator:rgba(84,84,88,0.65);--glass-blur:20px;
  --radius-bubble:18px;--radius-card:16px;--radius-badge:7px;
  --avatar-size:34px;--badge-h:18px;--msg-gap:8px;--pad-h:12px;--pad-v:7px;
  --spring:cubic-bezier(0.34,1.56,0.64,1);
  --ease-out:cubic-bezier(0.2,0,0,1);
}
[data-theme="light"]{
  --bg-primary:rgba(242,242,247,var(--bg-opacity));
  --bg-secondary:rgba(255,255,255,0.95);--bg-tertiary:rgba(229,229,234,0.95);
  --text-primary:rgba(0,0,0,1);--text-secondary:rgba(60,60,67,0.6);
  --separator:rgba(60,60,67,0.29);
}
[data-theme="amoled"]{
  --bg-primary:rgba(0,0,0,var(--bg-opacity));
  --bg-secondary:rgba(18,18,18,0.98);--bg-tertiary:rgba(38,38,38,0.98);
  --text-primary:rgba(255,255,255,1);--text-secondary:rgba(255,255,255,0.5);
  --separator:rgba(255,255,255,0.08);
}
html,body{width:100%;height:100%;background:transparent;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  font-size:var(--font-size);line-height:1.4;}
#chat-wrapper{width:100%;height:100%;perspective:1200px;perspective-origin:50% 50%;}
#chat-container{width:100%;height:100%;display:flex;flex-direction:column;
  justify-content:flex-end;padding:14px 12px;transform-style:preserve-3d;
  transition:transform .6s var(--ease-out);}
#chat-messages{display:flex;flex-direction:column;gap:var(--msg-gap);overflow:hidden;}
.message{display:flex;align-items:flex-end;gap:8px;max-width:100%;opacity:0;}
[data-animation="spring"] .message{transform:translateY(22px) scale(0.94);
  transition:transform .55s var(--spring),opacity .35s ease;}
[data-animation="slide"] .message{transform:translateX(-28px);
  transition:transform .4s var(--ease-out),opacity .3s ease;}
[data-animation="fade"] .message{transition:opacity .4s ease;}
[data-animation="none"] .message{transition:none;}
.message.visible{opacity:1;transform:none;}
.message.removing{opacity:0;transform:translateY(-10px) scale(0.94)!important;
  transition:opacity .3s ease,transform .3s ease!important;
  max-height:0;overflow:hidden;margin-bottom:0!important;pointer-events:none;}
.message.align-right{flex-direction:row-reverse;}
.message.align-center{justify-content:center;}
.message.align-center .message-content{align-items:center;}
.message.align-right .message-header{flex-direction:row-reverse;}
.message.align-right .message-bubble{border-bottom-left-radius:var(--radius-bubble);border-bottom-right-radius:4px;}
.avatar{width:var(--avatar-size);height:var(--avatar-size);border-radius:50%;display:flex;
  align-items:center;justify-content:center;font-size:calc(var(--font-size)*.72);
  font-weight:700;color:#fff;flex-shrink:0;letter-spacing:-.5px;
  box-shadow:0 2px 10px rgba(0,0,0,.35);position:relative;}
.avatar::after{content:'';position:absolute;inset:-2px;border-radius:50%;
  border:2px solid transparent;transition:border-color .3s ease;}
.avatar.ring-broadcaster::after{border-color:var(--broadcaster-color);}
.avatar.ring-moderator::after{border-color:var(--mod-color);}
.avatar.ring-vip::after{border-color:var(--vip-color);}
.avatar.ring-subscriber::after{border-color:var(--sub-color);}
.message-content{display:flex;flex-direction:column;gap:3px;min-width:0;
  max-width:calc(100% - var(--avatar-size) - 16px);}
.message-header{display:flex;align-items:center;gap:4px;padding:0 6px;}
.username{font-size:calc(var(--font-size)*.82);font-weight:600;letter-spacing:-.2px;white-space:nowrap;}
.badge{display:inline-flex;align-items:center;justify-content:center;
  height:var(--badge-h);min-width:var(--badge-h);padding:0 5px;
  border-radius:var(--radius-badge);font-size:calc(var(--font-size)*.62);
  font-weight:700;border:1px solid transparent;flex-shrink:0;line-height:1;}
.message-bubble{background:var(--bg-secondary);
  backdrop-filter:blur(var(--glass-blur)) saturate(1.4);
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(1.4);
  border-radius:var(--radius-bubble);border-bottom-left-radius:4px;
  padding:var(--pad-v) var(--pad-h);border:1px solid rgba(255,255,255,.08);
  box-shadow:0 2px 14px rgba(0,0,0,.18),0 0 0 .5px rgba(255,255,255,.04);
  word-break:break-word;position:relative;overflow:hidden;
  transition:background .2s ease,box-shadow .2s ease;}
.bubble-broadcaster{background:rgba(255,69,58,.14);border-color:rgba(255,69,58,.28);}
.bubble-moderator{background:rgba(52,199,89,.1);border-color:rgba(52,199,89,.22);}
.bubble-vip{background:rgba(191,90,242,.1);border-color:rgba(191,90,242,.22);}
.bubble-subscriber{background:rgba(255,159,10,.1);border-color:rgba(255,159,10,.22);}
.bubble-broadcaster::before,.bubble-moderator::before,.bubble-vip::before,.bubble-subscriber::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 0;}
.bubble-broadcaster::before{background:var(--broadcaster-color);}
.bubble-moderator::before{background:var(--mod-color);}
.bubble-vip::before{background:var(--vip-color);}
.bubble-subscriber::before{background:var(--sub-color);}
.message-text{color:var(--text-primary);font-size:var(--font-size);line-height:1.38;}
.emote-img{height:calc(var(--font-size)*1.7);width:auto;vertical-align:middle;margin:-3px 2px;}
.mention{background:rgba(0,122,255,.18);color:var(--accent-color);
  border-radius:5px;padding:0 4px;font-weight:600;}
.message-bits .message-bubble{
  background:linear-gradient(135deg,rgba(88,86,214,.14),rgba(191,90,242,.14));
  border-color:rgba(191,90,242,.3);animation:bitsPulse 2.4s ease-in-out infinite;}
@keyframes bitsPulse{0%,100%{box-shadow:0 2px 14px rgba(0,0,0,.18);}50%{box-shadow:0 4px 24px rgba(191,90,242,.32);}}
.message-firsttime .message-bubble{border:1.5px solid var(--accent-color);box-shadow:0 0 14px rgba(0,122,255,.22);}
.message-highlighted .message-bubble{background:rgba(0,122,255,.12);border-color:rgba(0,122,255,.3);}
#alert-overlay{position:fixed;inset:0;pointer-events:none;display:flex;
  flex-direction:column;align-items:center;justify-content:center;z-index:9999;}
#alert-container{display:flex;flex-direction:column;gap:12px;align-items:center;width:90%;max-width:520px;}
.alert-card{width:100%;background:var(--bg-secondary);
  backdrop-filter:blur(40px) saturate(1.6);-webkit-backdrop-filter:blur(40px) saturate(1.6);
  border-radius:22px;padding:18px 22px;border:1px solid rgba(255,255,255,.12);
  box-shadow:0 24px 64px rgba(0,0,0,.45),0 0 0 .5px rgba(255,255,255,.06);
  display:flex;align-items:center;gap:16px;opacity:0;
  transform:scale(.78) translateY(-24px);
  transition:opacity .5s var(--spring),transform .5s var(--spring);
  position:relative;overflow:hidden;}
.alert-card.visible{opacity:1;transform:scale(1) translateY(0);}
.alert-card.hiding{opacity:0;transform:scale(.9) translateY(-12px);
  transition:opacity .4s var(--ease-out),transform .4s var(--ease-out);}
.alert-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:22px 22px 0 0;}
.alert-follow::before{background:linear-gradient(90deg,var(--accent-color),var(--sys-teal));}
.alert-sub::before{background:linear-gradient(90deg,var(--sub-color),var(--sys-yellow));}
.alert-giftsub::before{background:linear-gradient(90deg,var(--vip-color),var(--sys-pink));}
.alert-bits::before{background:linear-gradient(90deg,var(--sys-purple),var(--sys-indigo));}
.alert-donation::before{background:linear-gradient(90deg,var(--sys-green),var(--sys-teal));}
.alert-raid::before{background:linear-gradient(90deg,var(--sys-red),var(--sys-orange));}
.alert-host::before{background:linear-gradient(90deg,var(--sys-orange),var(--sys-yellow));}
.alert-card::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(108deg,transparent 38%,rgba(255,255,255,.055) 50%,transparent 62%);
  animation:shimmer 2.2s ease-in-out infinite;}
@keyframes shimmer{0%{transform:translateX(-120%);}100%{transform:translateX(120%);}}
.alert-icon{font-size:2.4em;flex-shrink:0;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4));
  animation:iconPop .55s var(--spring) .15s both;z-index:1;}
@keyframes iconPop{from{transform:scale(0) rotate(-15deg);}to{transform:scale(1) rotate(0deg);}}
.alert-content{flex:1;min-width:0;z-index:1;}
.alert-title{font-size:calc(var(--font-size)*.78);font-weight:700;color:var(--text-secondary);
  text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px;}
.alert-message{font-size:calc(var(--font-size)*1.08);font-weight:600;color:var(--text-primary);
  line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
[data-theme="light"] .message-bubble{border-color:rgba(0,0,0,.06);box-shadow:0 2px 12px rgba(0,0,0,.08);}
[data-theme="light"] .alert-card{border-color:rgba(0,0,0,.08);box-shadow:0 24px 64px rgba(0,0,0,.18);}
[data-theme="light"] .alert-card::after{background:linear-gradient(108deg,transparent 38%,rgba(0,0,0,.03) 50%,transparent 62%);}
</script>

<script type="text/plain" id="w-js">
'use strict';
let cfg={fontSize:15,chatWidth:100,alignment:'left',perspectiveX:0,perspectiveY:0,
  theme:'dark',accentColor:'#007AFF',backgroundOpacity:80,showBadges:true,
  showAvatars:true,maxMessages:12,messageAnimation:'spring',showAlerts:true,
  alertDuration:5,modColor:'#34C759',vipColor:'#BF5AF2',subColor:'#FF9F0A'};
const alertQueue=[];let alertBusy=false;
window.addEventListener('onWidgetLoad',(obj)=>{cfg={...cfg,...obj.detail.fieldData};applyConfig();});
window.addEventListener('onEventReceived',(obj)=>{
  const l=obj.detail.listener,e=obj.detail.event;
  if(l==='message'){addMessage(e.data);return;}
  if(cfg.showAlerts)enqueueAlert(l,e);
});
function applyConfig(){
  const r=document.documentElement,c=document.getElementById('chat-container'),
        m=document.getElementById('chat-messages');
  r.style.setProperty('--font-size',cfg.fontSize+'px');
  r.style.setProperty('--bg-opacity',(cfg.backgroundOpacity/100).toFixed(2));
  r.style.setProperty('--accent-color',cfg.accentColor);
  r.style.setProperty('--mod-color',cfg.modColor);
  r.style.setProperty('--vip-color',cfg.vipColor);
  r.style.setProperty('--sub-color',cfg.subColor);
  c.style.width=cfg.chatWidth+'%';
  const am={left:'flex-start',right:'flex-end',center:'center'};
  m.style.alignItems=am[cfg.alignment]||'flex-start';
  r.setAttribute('data-theme',cfg.theme);
  r.setAttribute('data-animation',cfg.messageAnimation);
  const px=parseFloat(cfg.perspectiveX)||0,py=parseFloat(cfg.perspectiveY)||0;
  c.style.transform=(px||py)?`rotateX(${px}deg) rotateY(${py}deg)`:'';
}
function addMessage(data){
  if(!data)return;
  const me=document.getElementById('chat-messages'),role=detectRole(data.badges),
        color=data.color||roleColor(role);
  let ec='';
  if(data.tags&&data.tags['msg-id']==='highlighted-message')ec='message-highlighted';
  if(data.tags&&data.tags['first-msg']==='1')ec='message-firsttime';
  if(data.tags&&data.tags['bits'])ec='message-bits';
  const el=document.createElement('div');
  el.className=['message',`message-${role}`,`align-${cfg.alignment}`,ec].filter(Boolean).join(' ');
  el.innerHTML=buildMessageHTML(data,role,color);
  me.appendChild(el);
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('visible')));
  pruneMessages(me);
}
function buildMessageHTML(data,role,color){
  const av=cfg.showAvatars?buildAvatar(data,role):'';
  const bd=cfg.showBadges?buildBadges(data.badges):'';
  const tx=buildText(data.text||'',data.emotes||'');
  const un=esc(data.displayName||data.userName||'Anonyme');
  return `${av}<div class="message-content"><div class="message-header">${bd}<span class="username" style="color:${color}">${un}</span></div><div class="message-bubble bubble-${role}"><span class="message-text">${tx}</span></div></div>`;
}
function buildAvatar(data,role){
  const ini=(data.displayName||data.userName||'??').substring(0,2).toUpperCase();
  const bg=roleColor(role),ring=role!=='regular'?` ring-${role}`:'';
  return `<div class="avatar${ring}" style="background:${bg}">${ini}</div>`;
}
function buildBadges(badges){
  const bd=parseBadges(badges);if(!bd.length)return'';
  const ic={broadcaster:'📡',moderator:'🛡️',vip:'💎',subscriber:'⭐',partner:'✓',turbo:'⚡',premium:'👑',staff:'⚙️',admin:'🔑'};
  return bd.map(b=>{const ic2=ic[b.type]||'•',c=roleBadgeColor(b.type);
    return `<span class="badge badge-${b.type}" style="background:${c}22;border-color:${c}44;color:${c}">${ic2}</span>`;
  }).join('');
}
function parseBadges(raw){
  if(!raw)return[];
  if(Array.isArray(raw))return raw;
  return String(raw).split(',').map(s=>{const[t]=s.split('/');return{type:t};}).filter(b=>b.type);
}
function buildText(text,er){
  let safe=esc(text);
  if(er&&typeof er==='string'&&er.length)safe=renderEmotes(text,er);
  else if(er&&typeof er==='object')safe=renderEmotesObj(text,er);
  safe=safe.replace(/@(\w+)/g,(_,n)=>`<span class="mention">@${n}</span>`);
  return safe;
}
function renderEmotes(text,es){
  const rp=[];
  es.split('/').forEach(e=>{const[id,pos]=e.split(':');if(!pos)return;
    pos.split(',').forEach(p=>{const[s,en]=p.split('-').map(Number);rp.push({start:s,end:en+1,img:emImg(id)});});});
  rp.sort((a,b)=>b.start-a.start);
  const ch=[...text];rp.forEach(({start:s,end:en,img})=>ch.splice(s,en-s,img));
  return ch.join('');
}
function renderEmotesObj(text,eo){
  const rp=[];
  for(const[id,pos]of Object.entries(eo)){
    const pa=Array.isArray(pos)?pos:[pos];
    pa.forEach(p=>{const[s,en]=(typeof p==='string'?p:`${p.start}-${p.end}`).split('-').map(Number);
      rp.push({start:s,end:en+1,img:emImg(id)});});
  }
  rp.sort((a,b)=>b.start-a.start);
  const ch=[...text];rp.forEach(({start:s,end:en,img})=>ch.splice(s,en-s,img));
  return ch.join('');
}
function emImg(id){return`<img class="emote-img" src="https://static-cdn.jtvnw.net/emoticons/v2/${id}/default/dark/2.0" alt="" loading="lazy">`;}
function detectRole(badges){
  const list=parseBadges(badges),pr=['broadcaster','moderator','vip','subscriber','partner'];
  for(const p of pr)if(list.some(b=>b.type===p))return p;
  return'regular';
}
function roleColor(role){
  switch(role){case'broadcaster':return cfg.broadcasterColor||'#FF453A';
    case'moderator':return cfg.modColor||'#34C759';case'vip':return cfg.vipColor||'#BF5AF2';
    case'subscriber':return cfg.subColor||'#FF9F0A';case'partner':return'#9146FF';
    default:return cfg.accentColor||'#007AFF';}
}
function roleBadgeColor(type){
  switch(type){case'broadcaster':return cfg.broadcasterColor||'#FF453A';
    case'moderator':return cfg.modColor||'#34C759';case'vip':return cfg.vipColor||'#BF5AF2';
    case'subscriber':return cfg.subColor||'#FF9F0A';case'partner':return'#9146FF';
    case'turbo':return'#7B68EE';case'premium':return'#FFD700';
    case'staff':return'#00A8FF';case'admin':return'#FF4500';
    default:return cfg.accentColor||'#007AFF';}
}
function pruneMessages(container){
  const all=container.querySelectorAll('.message:not(.removing)'),max=parseInt(cfg.maxMessages)||12;
  if(all.length<=max)return;
  const ex=all.length-max;
  for(let i=0;i<ex;i++){const el=all[i];el.classList.add('removing');setTimeout(()=>el.remove(),400);}
}
function enqueueAlert(listener,event){alertQueue.push({listener,event});if(!alertBusy)drainAlertQueue();}
function drainAlertQueue(){if(!alertQueue.length){alertBusy=false;return;}alertBusy=true;const{listener,event}=alertQueue.shift();displayAlert(listener,event);}
function displayAlert(listener,event){
  const config=buildAlertConfig(listener,event);
  if(!config){drainAlertQueue();return;}
  const cont=document.getElementById('alert-container'),card=document.createElement('div');
  card.className=`alert-card alert-${config.type}`;
  card.innerHTML=`<div class="alert-icon">${config.icon}</div><div class="alert-content"><div class="alert-title">${esc(config.title)}</div><div class="alert-message">${esc(config.message)}</div></div>`;
  cont.appendChild(card);
  requestAnimationFrame(()=>requestAnimationFrame(()=>card.classList.add('visible')));
  const dur=(parseFloat(cfg.alertDuration)||5)*1000;
  setTimeout(()=>{card.classList.add('hiding');setTimeout(()=>{card.remove();drainAlertQueue();},500);},dur);
}
function buildAlertConfig(l,e){
  const name=e.name||e.displayName||e.sender||"Quelqu'un",am=e.amount||e.count||'',
        mo=e.months||'',ms=e.message?` — "${e.message}"`:'',gi=e.sender||e.gifterDisplayName||'';
  switch(l){
    case'follower-latest':return{type:'follow',icon:'💙',title:'Nouveau Suiveur !',message:`${name} suit maintenant la chaîne !`};
    case'subscriber-latest':
      if(e.bulkGifted)return{type:'giftsub',icon:'🎁',title:`${am} Abonnements Offerts !`,message:`${name} offre ${am} abonnements à la communauté !`};
      if(e.gifted)return{type:'giftsub',icon:'🎁',title:'Cadeau Abonnement !',message:`${gi} offre un abonnement à ${name} !`};
      return{type:'sub',icon:'⭐',title:mo>1?`${mo} mois d'abonnement !`:'Nouvel Abonné !',message:mo>1?`${name} est abonné depuis ${mo} mois !${ms}`:`${name} vient de s'abonner !${ms}`};
    case'cheer-latest':return{type:'bits',icon:'💎',title:`${am} Bits !`,message:`${name} envoie ${am} bits !${ms}`};
    case'tip-latest':return{type:'donation',icon:'💰',title:`Don de ${am}€ !`,message:`${name} a fait un don de ${am}€ !${ms}`};
    case'raid-latest':return{type:'raid',icon:'⚔️',title:'RAID INCOMING !',message:`${name} arrive avec ${am} raiders !`};
    case'host-latest':return{type:'host',icon:'📡',title:'Host !',message:`${name} host la chaîne avec ${am} viewers !`};
    default:return null;
  }
}
function esc(str){if(typeof str!=='string')return String(str||'');
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
</script>

<!-- ══ Script principal de la preview ══ -->
<script>
// Récupère le CSS et JS du widget depuis les blocs text/plain
const W_CSS = document.getElementById('w-css').textContent;
const W_JS  = document.getElementById('w-js').textContent;

function getConfig() {
  return {
    theme:     document.getElementById('ctrl-theme').value,
    animation: document.getElementById('ctrl-anim').value,
    alignment: document.getElementById('ctrl-align').value,
    fontSize:  parseInt(document.getElementById('ctrl-size').value),
    rotX:      parseInt(document.getElementById('ctrl-rx').value),
    rotY:      parseInt(document.getElementById('ctrl-ry').value),
    opacity:   (parseInt(document.getElementById('ctrl-opacity').value) / 100).toFixed(2),
    accent:    document.getElementById('ctrl-accent').value,
  };
}

function buildSrcdoc(c) {
  // Le JS est passé via window.__cfg pour éviter les conflits de template literal
  const cfgJson = JSON.stringify({
    fontSize: c.fontSize, chatWidth: 100, alignment: c.alignment,
    perspectiveX: c.rotX, perspectiveY: c.rotY, theme: c.theme,
    accentColor: c.accent, backgroundOpacity: c.opacity * 100,
    showBadges: true, showAvatars: true, maxMessages: 12,
    messageAnimation: c.animation, showAlerts: true, alertDuration: 4,
    modColor: '#34C759', vipColor: '#BF5AF2', subColor: '#FF9F0A'
  });

  return `<!DOCTYPE html>
<html data-theme="${c.theme}" data-animation="${c.animation}" lang="fr">
<head><meta charset="UTF-8">
<style>
:root {
  --font-size: ${c.fontSize}px;
  --bg-opacity: ${c.opacity};
  --accent-color: ${c.accent};
  --mod-color: #34C759; --vip-color: #BF5AF2; --sub-color: #FF9F0A;
  --broadcaster-color: #FF453A;
}
${W_CSS}
</style>
</head>
<body>
<div id="chat-wrapper"><div id="chat-container"><div id="chat-messages"></div></div></div>
<div id="alert-overlay"><div id="alert-container"></div></div>
<script>
${W_JS}
// Applique la config immédiatement
Object.assign(cfg, ${cfgJson});
applyConfig();
<\/script>
</body></html>`;
}

function rebuild() {

}
