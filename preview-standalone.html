<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>🎮 Gamer Chat Overlay — Preview</title>

  <!-- ══ Control bar CSS (preview shell) ══ -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: linear-gradient(135deg, #05070f 0%, #0a0e1a 50%, #0d1220 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: 'Inter', system-ui, sans-serif;
      color: #e2e8f8;
    }

    /* ─ Top control bar ─ */
    .preview-bar {
      width: 100%;
      background: rgba(6, 8, 16, 0.8);
      backdrop-filter: blur(20px);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      border-bottom: 1px solid rgba(0, 200, 255, 0.12);
      z-index: 100;
      position: sticky;
      top: 0;
    }

    .preview-bar h1 {
      color: #00c8ff;
      font-family: 'Rajdhani', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      flex-shrink: 0;
      text-shadow: 0 0 12px rgba(0,200,255,0.5);
    }

    .sep { width: 1px; height: 22px; background: rgba(255,255,255,0.12); flex-shrink: 0; }

    .ctrl-group { display: flex; align-items: center; gap: 5px; }
    .ctrl-group label {
      color: rgba(165, 185, 215, 0.6);
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      white-space: nowrap;
      font-family: 'Rajdhani', sans-serif;
    }
    .ctrl-group select {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.14);
      color: #e2e8f8;
      border-radius: 6px;
      padding: 3px 7px;
      font-size: 12px;
      cursor: pointer;
      outline: none;
      font-family: 'Inter', sans-serif;
    }
    .ctrl-group input[type="range"] {
      width: 70px;
      accent-color: #00c8ff;
      cursor: pointer;
    }
    .ctrl-group input[type="color"] {
      width: 28px; height: 24px; padding: 2px;
      border-radius: 5px; border: 1px solid rgba(255,255,255,0.15);
      background: none; cursor: pointer;
    }
    .ctrl-group input[type="number"] {
      width: 64px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.14);
      color: #e2e8f8;
      border-radius: 6px;
      padding: 3px 6px;
      font-size: 12px;
      outline: none;
      font-family: 'Inter', sans-serif;
    }
    .ctrl-group input[type="text"] {
      width: 130px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.14);
      color: #e2e8f8;
      border-radius: 6px;
      padding: 3px 7px;
      font-size: 12px;
      outline: none;
      font-family: 'Inter', sans-serif;
    }

    .btn {
      background: rgba(0, 200, 255, 0.15);
      color: #00c8ff;
      border: 1px solid rgba(0, 200, 255, 0.35);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 700;
      font-family: 'Rajdhani', sans-serif;
      cursor: pointer;
      white-space: nowrap;
      letter-spacing: 0.5px;
      transition: background 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
      text-transform: uppercase;
    }
    .btn:hover  { background: rgba(0, 200, 255, 0.25); box-shadow: 0 0 10px rgba(0,200,255,0.2); }
    .btn:active { transform: scale(0.94); }
    .btn.green  { background: rgba(0,255,136,0.12); color: #00ff88; border-color: rgba(0,255,136,0.3); }
    .btn.green:hover { background: rgba(0,255,136,0.22); box-shadow: 0 0 10px rgba(0,255,136,0.2); }
    .btn.purple { background: rgba(168,85,247,0.12); color: #a855f7; border-color: rgba(168,85,247,0.3); }
    .btn.purple:hover { background: rgba(168,85,247,0.22); }
    .btn.orange { background: rgba(255,194,0,0.12); color: #ffc200; border-color: rgba(255,194,0,0.3); }
    .btn.orange:hover { background: rgba(255,194,0,0.22); }
    .btn.red    { background: rgba(255,42,94,0.12); color: #ff2a5e; border-color: rgba(255,42,94,0.3); }
    .btn.red:hover { background: rgba(255,42,94,0.22); }
    .btn.dark   { background: rgba(255,255,255,0.07); color: rgba(165,185,215,0.7); border-color: rgba(255,255,255,0.12); }
    .btn.dark:hover { background: rgba(255,255,255,0.12); }

    .section-label {
      font-family: 'Rajdhani', sans-serif;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(0,200,255,0.5);
      padding: 2px 6px;
      border: 1px solid rgba(0,200,255,0.2);
      border-radius: 4px;
    }

    /* ─ Preview stage ─ */
    .preview-stage {
      position: relative;
      width: 460px;
      height: 620px;
      margin: 24px auto 32px;
      border-radius: 14px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(0, 200, 255, 0.12),
        0 32px 80px rgba(0,0,0,0.7),
        0 0 60px rgba(0,200,255,0.04);
    }

    /* Scanline overlay on preview */
    .preview-stage::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.04) 2px,
        rgba(0,0,0,0.04) 4px
      );
      pointer-events: none;
      z-index: 10;
      border-radius: 14px;
    }

    /* Corner brackets */
    .preview-stage::before {
      content: '';
      position: absolute;
      inset: 0;
      border: 1px solid rgba(0, 200, 255, 0.15);
      border-radius: 14px;
      pointer-events: none;
      z-index: 11;
    }

    .corner-tl, .corner-tr, .corner-bl, .corner-br {
      position: absolute;
      width: 16px;
      height: 16px;
      border-color: #00c8ff;
      border-style: solid;
      z-index: 12;
    }
    .corner-tl { top: 8px;  left: 8px;  border-width: 2px 0 0 2px; border-radius: 3px 0 0 0; }
    .corner-tr { top: 8px;  right: 8px; border-width: 2px 2px 0 0; border-radius: 0 3px 0 0; }
    .corner-bl { bottom: 8px; left: 8px;  border-width: 0 0 2px 2px; border-radius: 0 0 0 3px; }
    .corner-br { bottom: 8px; right: 8px; border-width: 0 2px 2px 0; border-radius: 0 0 3px 0; }

    #widget-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* ─ Status badge ─ */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #00ff88;
      padding: 3px 8px;
      background: rgba(0,255,136,0.1);
      border: 1px solid rgba(0,255,136,0.25);
      border-radius: 5px;
    }
    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #00ff88;
      box-shadow: 0 0 6px #00ff88;
      animation: statusPulse 1.5s ease-in-out infinite;
    }
    @keyframes statusPulse {
      0%,100% { opacity: 1; }
      50%      { opacity: 0.4; }
    }
  </style>

  <!-- ══ Widget HTML (stored as text, injected into the iframe) ══ -->
  <script type="text/plain" id="widget-html">
<div id="goal-bar" class="goal-bar goal-horizontal">
  <div class="goal-inner">
    <div class="goal-header">
      <span class="goal-title" id="goal-title">Goal</span>
      <span class="goal-values">
        <span id="goal-current">0</span>
        <span class="goal-sep"> / </span>
        <span id="goal-target">100</span>
      </span>
    </div>
    <div class="goal-track">
      <div id="goal-fill" class="goal-fill"></div>
    </div>
    <span class="goal-percent" id="goal-percent">0%</span>
  </div>
</div>
<div id="chat-wrapper">
  <div id="chat-container">
    <div id="chat-messages"></div>
  </div>
</div>
<div id="alert-overlay">
  <div id="alert-container"></div>
</div>
  </script>

  <!-- ══ Widget CSS ══ -->
  <script type="text/plain" id="widget-css">
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
:root{
  --neon-blue:#00c8ff;--neon-green:#00ff88;--neon-red:#ff2a5e;--neon-yellow:#ffd000;
  --neon-orange:#ff7700;--neon-pink:#ff00aa;--neon-purple:#a855f7;--neon-teal:#00ffd5;--neon-gold:#ffc200;
  --accent-color:#00c8ff;--font-size:14px;
  --mod-color:#00ff88;--vip-color:#a855f7;--sub-color:#ffc200;--broadcaster-color:#00c8ff;
  --glow-user:1;--glow:var(--glow-user);
  --bg-card:rgba(4,6,12,0.72);--bg-card-2:rgba(8,10,20,0.92);
  --text-primary:#f1f5ff;--text-secondary:rgba(175,195,230,0.70);--border-color:rgba(255,255,255,0.08);
  --radius-card:10px;--radius-badge:4px;--avatar-size:30px;--badge-h:17px;
  --msg-gap:12px;--pad-h:13px;--pad-v:8px;
  --spring:cubic-bezier(0.34,1.56,0.64,1);--ease-out:cubic-bezier(0.2,0,0,1);--power:cubic-bezier(0.16,1,0.3,1);
}
[data-theme="light"]{
  --glow:calc(var(--glow-user) * 0.55);
  --bg-card:rgba(244,247,255,0.92);--bg-card-2:rgba(255,255,255,0.95);
  --text-primary:#0a0e1a;--text-secondary:rgba(30,45,80,0.65);--border-color:rgba(0,0,0,0.08);
}
[data-theme="amoled"]{
  --bg-card:rgba(0,0,0,0.88);--bg-card-2:rgba(0,0,0,0.95);
  --text-primary:#ffffff;--text-secondary:rgba(255,255,255,0.55);--border-color:rgba(255,255,255,0.06);
}
html,body{width:100%;height:100%;background:transparent;overflow:hidden;font-family:'Inter',system-ui,sans-serif;font-size:var(--font-size);line-height:1.4}

/* position:fixed + inset:0: the widget always fills the OBS browser source exactly */
#chat-wrapper{position:fixed;inset:0;perspective:1200px;perspective-origin:50% 50%}
#chat-container{width:100%;height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:6px 4px;transform-style:preserve-3d;transition:transform 0.6s var(--ease-out)}
/* Inner padding leaves room for the neon glow (otherwise clipped by overflow).
   justify-content:flex-end + min-height:0: on overflow the OLDEST messages (top) are clipped,
   never the newest one (bottom, next to the goal bar) */
#chat-messages{display:flex;flex-direction:column;justify-content:flex-end;gap:var(--msg-gap);overflow:hidden;min-height:0;flex:0 1 auto;padding:26px 20px 18px}

/* ─── Message ─── */
.message{
  --nc:var(--accent-color);--nc-core:#e6faff;
  --nc-60:rgba(0,200,255,0.6);--nc-35:rgba(0,200,255,0.35);--nc-15:rgba(0,200,255,0.15);
  --uc:var(--accent-color);--uc-core:#e6faff;
  display:flex;align-items:flex-end;gap:10px;max-width:100%;opacity:0
}
[data-animation="spring"] .message{transform:translateY(20px) scale(0.95);transition:transform 0.5s var(--spring),opacity 0.3s ease}
[data-animation="slide"] .message{transform:translateX(-30px);transition:transform 0.35s var(--power),opacity 0.25s ease}
[data-animation="fade"] .message{transition:opacity 0.35s ease}
[data-animation="none"] .message{transition:none}
.message.visible{opacity:1;transform:none}
.message.removing{opacity:0;transform:translateX(-16px) scale(0.94) !important;transition:opacity 0.25s ease,transform 0.25s ease !important;max-height:0;overflow:hidden;margin-bottom:0 !important;pointer-events:none}
.message.align-right{flex-direction:row-reverse}
.message.align-center{justify-content:center}
.message.align-center .message-content{align-items:center}
.message.align-right .message-header{flex-direction:row-reverse}
.message.align-right .message-bubble{border-bottom-left-radius:var(--radius-card);border-bottom-right-radius:3px}

/* ─── Avatar: thin neon ring ─── */
.avatar{width:var(--avatar-size);height:var(--avatar-size);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:calc(var(--font-size)*0.7);font-weight:700;font-family:'Rajdhani','Inter',sans-serif;color:var(--nc-core);text-shadow:0 0 6px var(--nc);flex-shrink:0;letter-spacing:0.5px;position:relative}
.avatar-pic{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%}
.avatar::after{content:'';position:absolute;inset:-2px;border-radius:50%;border:1.5px solid var(--nc-core);z-index:2;pointer-events:none;
  box-shadow:0 0 calc(4px*var(--glow)) var(--nc),0 0 calc(12px*var(--glow)) var(--nc-60)}

/* ─── Bubble: neon tube (bright core + colored inner/outer glow) ─── */
/* No percentage max-width here: it was resolved against the message's own shrink-to-fit width,
   which made the bubble narrower than the username (worst when avatars are hidden). */
.message-content{display:flex;flex-direction:column;gap:0;min-width:0;flex:0 1 auto}
.message-bubble{
  position:relative;word-break:break-word;padding:0;
  background:var(--bg-card);
  border:1.5px solid var(--nc-core);
  border-radius:var(--radius-card);border-bottom-left-radius:3px;
  box-shadow:
    0 0 calc(4px*var(--glow)) var(--nc),
    0 0 calc(16px*var(--glow)) var(--nc-60),
    inset 0 0 calc(10px*var(--glow)) var(--nc-35);
}
.message-header{display:flex;align-items:center;gap:5px;padding:7px var(--pad-h) 0;min-width:0}
.username{
  font-family:'Rajdhani','Inter',sans-serif;font-size:calc(var(--font-size)*0.9);font-weight:700;letter-spacing:0.8px;text-transform:uppercase;white-space:nowrap;
  color:var(--uc-core);
  text-shadow:0 0 calc(3px*var(--glow)) var(--uc),0 0 calc(10px*var(--glow)) var(--uc),0 0 calc(20px*var(--glow)) var(--uc)
}
.badge{display:inline-flex;align-items:center;height:var(--badge-h);padding:0 1px;font-size:calc(var(--font-size)*0.72);flex-shrink:0;line-height:1;background:none !important;border:none !important;
  filter:drop-shadow(0 0 calc(3px*var(--glow)) currentColor)}
.message-text{display:block;color:var(--text-primary);font-size:var(--font-size);line-height:1.5;font-family:'Inter',system-ui,sans-serif;padding:3px var(--pad-h) 8px}
.emote-img{height:calc(var(--font-size)*1.7);width:auto;vertical-align:middle;margin:-3px 2px}
.mention{color:#fff;font-weight:600;text-shadow:0 0 4px var(--accent-color),0 0 10px var(--accent-color)}

/* ─── Tube ignition (flicker on arrival) ─── */
[data-flicker="on"] .message.visible .message-bubble,
[data-flicker="on"] .message.visible .avatar::after{animation:neonIgnite 0.9s linear both}
[data-flicker="on"] .message.visible .username{animation:neonIgnite 1.1s linear 0.1s both}
@keyframes neonIgnite{
  0%{opacity:0.1}6%{opacity:1}10%{opacity:0.25}16%{opacity:0.9}20%{opacity:0.15}
  30%{opacity:1}34%{opacity:0.6}40%,100%{opacity:1}
}

/* ─── Special messages ─── */
.message-bits .message-bubble{animation:bitsPulse 1.6s ease-in-out infinite}
[data-flicker="on"] .message-bits.visible .message-bubble{animation:neonIgnite 0.9s linear both,bitsPulse 1.6s ease-in-out 0.9s infinite}
@keyframes bitsPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35) saturate(1.3)}}
.message-firsttime{--glow:calc(var(--glow-user) * 1.5)}
.message-highlighted .message-bubble{background:linear-gradient(var(--nc-15),var(--nc-15)),var(--bg-card)}

/* ─── Goal bar ─── */
.goal-bar{position:fixed;z-index:100;padding:10px 16px;background:var(--bg-card);border:1.5px solid var(--accent-color);display:none;
  box-shadow:0 0 calc(4px*var(--glow)) var(--accent-color),0 0 calc(14px*var(--glow)) var(--accent-color)}
.goal-bar.goal-visible{display:block}
/* Floating bar with a margin on every side so the neon glow goes all the way around (not cut by the screen edge) */
.goal-bar.goal-horizontal{left:16px;right:16px;bottom:16px;border-radius:10px}
.goal-bar.goal-vertical{top:16px;right:16px;bottom:16px;width:52px;padding:16px 10px;border-radius:10px;display:none;flex-direction:column;align-items:center}
.goal-bar.goal-vertical.goal-visible{display:flex}
.goal-inner{display:flex;flex-direction:column;gap:6px;width:100%;height:100%}
/* horizontal: title · values · % on one line, progress line below */
.goal-bar.goal-horizontal .goal-inner{display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:10px;row-gap:7px}
.goal-bar.goal-horizontal .goal-header{grid-column:1;grid-row:1;min-width:0}
.goal-bar.goal-horizontal .goal-percent{grid-column:2;grid-row:1}
.goal-bar.goal-horizontal .goal-track{grid-column:1 / -1;grid-row:2}
.goal-title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.goal-bar.goal-vertical .goal-inner{flex-direction:column-reverse;align-items:center}
.goal-header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.goal-bar.goal-vertical .goal-header{flex-direction:column;align-items:center;gap:4px}
.goal-title{font-family:'Rajdhani','Inter',sans-serif;font-size:calc(var(--font-size)*0.85);font-weight:700;text-transform:uppercase;letter-spacing:1.4px;color:#fff;text-shadow:0 0 4px var(--accent-color),0 0 12px var(--accent-color)}
.goal-values{font-family:'Rajdhani','Inter',sans-serif;font-size:calc(var(--font-size)*0.85);font-weight:600;color:var(--text-primary);white-space:nowrap}
.goal-sep{color:var(--text-secondary)}
.goal-track{width:100%;height:4px;background:rgba(255,255,255,0.08);border-radius:2px;overflow:visible;position:relative}
.goal-bar.goal-vertical .goal-track{width:4px;height:100%;flex:1;border-radius:7px;overflow:hidden}
.goal-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent-color),#fff);border-radius:2px;transition:width 1s var(--power);position:relative;
  box-shadow:0 0 calc(6px*var(--glow)) var(--accent-color),0 0 calc(16px*var(--glow)) var(--accent-color)}
.goal-bar.goal-vertical .goal-fill{width:100%;height:0%;position:absolute;bottom:0;background:linear-gradient(0deg,var(--accent-color),#fff);transition:height 1s var(--power);border-radius:7px}
.goal-percent{font-family:'Rajdhani','Inter',sans-serif;font-size:calc(var(--font-size)*0.8);font-weight:700;color:#fff;text-shadow:0 0 4px var(--accent-color),0 0 12px var(--accent-color);text-align:right;white-space:nowrap}
.goal-bar.goal-vertical .goal-percent{writing-mode:horizontal-tb;font-size:calc(var(--font-size)*0.72);text-align:center}
/* vertical: rotated title, stacked values → nothing overflows the 52px bar */
.goal-bar.goal-vertical .goal-title{writing-mode:vertical-rl;transform:rotate(180deg);max-height:45vh;font-size:calc(var(--font-size)*0.75)}
.goal-bar.goal-vertical .goal-values{display:flex;flex-direction:column;align-items:center;line-height:1.15;font-size:calc(var(--font-size)*0.72)}
.goal-bar.goal-vertical .goal-sep{display:block;width:14px;height:1px;font-size:0;background:var(--accent-color);box-shadow:0 0 4px var(--accent-color);margin:2px 0}

/* ─── Alerts: neon sign ─── */
#alert-overlay{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:24px;z-index:9999}
#alert-container{display:flex;flex-direction:column;gap:14px;align-items:center;width:86%;max-width:480px}
.alert-card{--ac:var(--accent-color);--ac2:var(--neon-teal);
  width:100%;background:var(--bg-card-2);border-radius:12px;padding:14px 18px;border:1.5px solid var(--ac);
  box-shadow:0 0 calc(4px*var(--glow)) var(--ac),0 0 calc(18px*var(--glow)) var(--ac),0 0 calc(40px*var(--glow)) var(--ac2),inset 0 0 calc(10px*var(--glow)) var(--ac);
  display:flex;align-items:center;gap:14px;opacity:0;transform:translateY(-24px) scale(0.94);transition:opacity 0.4s var(--spring),transform 0.4s var(--spring);position:relative;overflow:hidden}
.alert-card.visible{opacity:1;transform:translateY(0) scale(1)}
[data-flicker="on"] .alert-card.visible{animation:neonIgnite 1s linear both}
.alert-card.hiding{opacity:0;transform:translateY(-12px) scale(0.95);transition:opacity 0.3s ease,transform 0.3s ease}
.alert-follow{--ac:var(--accent-color);--ac2:var(--neon-teal)}
.alert-sub{--ac:var(--sub-color);--ac2:var(--neon-orange)}
.alert-giftsub{--ac:var(--vip-color);--ac2:var(--neon-pink)}
.alert-bits{--ac:var(--neon-purple);--ac2:var(--neon-blue)}
.alert-donation{--ac:var(--neon-green);--ac2:var(--neon-teal)}
.alert-raid{--ac:var(--neon-red);--ac2:var(--neon-orange)}
.alert-host{--ac:var(--neon-orange);--ac2:var(--neon-yellow)}
.alert-icon{font-size:1.8em;flex-shrink:0;animation:iconPop 0.5s var(--spring) 0.1s both;z-index:1;filter:drop-shadow(0 0 6px var(--ac))}
@keyframes iconPop{from{transform:scale(0) rotate(-18deg)}to{transform:scale(1) rotate(0deg)}}
.alert-content{flex:1;min-width:0;z-index:1}
.alert-title{font-family:'Rajdhani','Inter',sans-serif;font-size:calc(var(--font-size)*0.95);font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:1.6px;margin-bottom:3px;
  text-shadow:0 0 2px #fff,0 0 6px var(--ac),0 0 14px var(--ac),0 0 28px var(--ac)}
.alert-message{font-size:calc(var(--font-size)*1.05);font-weight:600;color:var(--text-primary);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ─── Light theme: neon washes out on light backgrounds → reduced glow ─── */
[data-theme="light"] .message-bubble{border-color:var(--nc)}
[data-theme="light"] .username{color:var(--uc)}
[data-theme="light"] .alert-title,[data-theme="light"] .goal-title,[data-theme="light"] .goal-percent{color:var(--text-primary)}
[data-theme="light"] .goal-track{background:rgba(0,0,0,0.06)}
  </script>

  <!-- ══ Widget JS ══ -->
  <script type="text/plain" id="widget-js">
'use strict';
let cfg={fontSize:14,chatWidth:100,alignment:'left',perspectiveX:0,perspectiveY:0,theme:'dark',accentColor:'#00c8ff',backgroundOpacity:88,showBadges:true,showAvatars:true,maxMessages:12,messageAnimation:'spring',showAlerts:true,alertDuration:5,modColor:'#00ff88',vipColor:'#a855f7',subColor:'#ffc200',showGoal:false,goalType:'followers',goalTitle:'Stream goal',goalCurrent:0,goalTarget:100,goalOrientation:'horizontal',goalColor:'#00c8ff',goalAutoTrack:true,neonGlow:100,neonFlicker:true,neonColorSource:'role'};
const alertQueue=[];let alertBusy=false,goalAutoCount=0;
window.addEventListener('onWidgetLoad',(obj)=>{const fields=obj.detail.fieldData;cfg={...cfg,...fields};applyConfig();applyGoal()});
window.addEventListener('onEventReceived',(obj)=>{const listener=obj.detail.listener,event=obj.detail.event;if(listener==='message'){addMessage(event.data);return}if(cfg.showAlerts)enqueueAlert(listener,event);if(cfg.showGoal&&cfg.goalAutoTrack)trackGoalEvent(listener,event)});
function applyConfig(){const root=document.documentElement,container=document.getElementById('chat-container'),messages=document.getElementById('chat-messages');root.style.setProperty('--font-size',cfg.fontSize+'px');root.style.setProperty('--bg-opacity',(cfg.backgroundOpacity/100).toFixed(2));root.style.setProperty('--accent-color',cfg.accentColor);root.style.setProperty('--mod-color',cfg.modColor);root.style.setProperty('--vip-color',cfg.vipColor);root.style.setProperty('--sub-color',cfg.subColor);const ng=parseFloat(cfg.neonGlow);root.style.setProperty('--glow-user',String(isNaN(ng)?1:ng/100));root.setAttribute('data-flicker',(cfg.neonFlicker===false||cfg.neonFlicker==='false')?'off':'on');container.style.width=cfg.chatWidth+'%';const alignMap={left:'flex-start',right:'flex-end',center:'center'};messages.style.alignItems=alignMap[cfg.alignment]||'flex-start';root.setAttribute('data-theme',cfg.theme);root.setAttribute('data-animation',cfg.messageAnimation);const px=parseFloat(cfg.perspectiveX)||0,py=parseFloat(cfg.perspectiveY)||0;container.style.transform=(px||py)?`rotateX(${px}deg) rotateY(${py}deg)`:'';}
function applyGoal(){const bar=document.getElementById('goal-bar'),wrapper=document.getElementById('chat-wrapper');if(!bar)return;if(!cfg.showGoal){bar.classList.remove('goal-visible');if(wrapper){wrapper.style.paddingBottom='';wrapper.style.paddingRight='';}return}bar.className=`goal-bar goal-${cfg.goalOrientation}`;bar.classList.add('goal-visible');document.documentElement.style.setProperty('--accent-color',cfg.goalColor||cfg.accentColor);const titleEl=document.getElementById('goal-title');if(titleEl)titleEl.textContent=cfg.goalTitle||'Goal';goalAutoCount=parseFloat(cfg.goalCurrent)||0;updateGoalProgress(goalAutoCount,cfg.goalTarget);if(wrapper){requestAnimationFrame(()=>{if(cfg.goalOrientation==='horizontal'){const bx=bar.getBoundingClientRect();wrapper.style.paddingBottom=Math.ceil(window.innerHeight-bx.top)+'px';wrapper.style.paddingRight='';}else{const bx=bar.getBoundingClientRect();wrapper.style.paddingRight=Math.ceil(window.innerWidth-bx.left)+'px';wrapper.style.paddingBottom='';}});}}
function updateGoalProgress(current,target){const cur=Math.max(0,parseFloat(current)||0),tgt=Math.max(1,parseFloat(target)||100),pct=Math.min(100,(cur/tgt)*100);const curEl=document.getElementById('goal-current'),tgtEl=document.getElementById('goal-target'),pctEl=document.getElementById('goal-percent'),fillEl=document.getElementById('goal-fill'),barEl=document.getElementById('goal-bar');if(curEl)curEl.textContent=Math.floor(cur).toLocaleString();if(tgtEl)tgtEl.textContent=Math.floor(tgt).toLocaleString();if(pctEl)pctEl.textContent=Math.round(pct)+'%';if(fillEl&&barEl){if(barEl.classList.contains('goal-vertical')){fillEl.style.height=pct+'%';fillEl.style.width='100%'}else{fillEl.style.width=pct+'%';fillEl.style.height='100%'}}}
function trackGoalEvent(listener,event){const type=cfg.goalType;if(type==='followers'&&listener==='follower-latest'){goalAutoCount++;updateGoalProgress(goalAutoCount,cfg.goalTarget)}else if(type==='subs'&&listener==='subscriber-latest'){goalAutoCount+=(event.bulkGifted?(event.amount||1):1);updateGoalProgress(goalAutoCount,cfg.goalTarget)}else if(type==='bits'&&listener==='cheer-latest'){goalAutoCount+=parseFloat(event.amount)||0;updateGoalProgress(goalAutoCount,cfg.goalTarget)}else if(type==='donations'&&listener==='tip-latest'){goalAutoCount+=parseFloat(event.amount)||0;updateGoalProgress(goalAutoCount,cfg.goalTarget)}}
function addMessage(data){if(!data)return;const messagesEl=document.getElementById('chat-messages'),role=detectRole(data.badges),color=data.color||roleColor(role);let extraClass='';if(data.tags&&data.tags['msg-id']==='highlighted-message')extraClass='message-highlighted';if(data.tags&&data.tags['first-msg']==='1')extraClass='message-firsttime';if(data.tags&&data.tags['bits'])extraClass='message-bits';const el=document.createElement('div');el.className=['message',`message-${role}`,`align-${cfg.alignment}`,extraClass].filter(Boolean).join(' ');el.innerHTML=buildMessageHTML(data,role,color);setNeonVars(el,cfg.neonColorSource==='user'?color:roleColor(role),color,roleColor(role));messagesEl.appendChild(el);requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('visible')));pruneMessages(messagesEl)}
function buildMessageHTML(data,role,color){const avatarHTML=cfg.showAvatars?buildAvatar(data,role,color):'',badgesHTML=cfg.showBadges?buildBadges(data.badges,role):'',msgHTML=buildText(data.text||'',data.emotes||'',data.userId||''),username=escapeHTML(data.displayName||data.userName||'Anonymous');return`${avatarHTML}<div class="message-content"><div class="message-bubble bubble-${role}"><div class="message-header">${badgesHTML}<span class="username">${username}</span></div><span class="message-text">${msgHTML}</span></div></div>`}
function buildAvatar(data,role,color){const ring=role!=='regular'?` ring-${role}`:'',bg=hexToRgba(color,0.30),brd=hexToRgba(color,0.60),styleStr=`background:${bg}`;if(data.avatar){const src=String(data.avatar).replace(/"/g,'');return`<div class="avatar${ring}" style="${styleStr}"><img class="avatar-pic" src="${src}" alt="" loading="lazy" onerror="this.style.display='none'"></div>`}const initials=(data.displayName||data.userName||'??').substring(0,2).toUpperCase();return`<div class="avatar${ring}" style="${styleStr}">${initials}</div>`}
function hexToRgba(hex,alpha){if(!hex||!hex.startsWith('#'))return`rgba(120,120,180,${alpha})`;const h=hex.replace('#',''),r=parseInt(h.substring(0,2),16)||0,g=parseInt(h.substring(2,4),16)||0,b=parseInt(h.substring(4,6),16)||0;return`rgba(${r},${g},${b},${alpha})`}
function buildBadges(badges,role){const badgeData=parseBadges(badges);if(!badgeData.length)return'';const icons={broadcaster:'📡',moderator:'🛡️',vip:'💎',subscriber:'⭐',partner:'✓',turbo:'⚡',premium:'👑',staff:'⚙️',admin:'🔑'};return badgeData.map(b=>{const icon=icons[b.type]||'•',c=roleBadgeColor(b.type);return`<span class="badge badge-${b.type}" style="background:${c}22;border-color:${c}44;color:${c}">${icon}</span>`}).join('')}
function parseBadges(raw){if(!raw)return[];if(Array.isArray(raw))return raw;return String(raw).split(',').map(s=>{const[type]=s.split('/');return{type}}).filter(b=>b.type)}
function buildText(text,emotesRaw,userId){let safe=escapeHTML(text);if(emotesRaw&&typeof emotesRaw==='string'&&emotesRaw.length)safe=renderEmotes(text,emotesRaw);else if(emotesRaw&&typeof emotesRaw==='object')safe=renderEmotesObj(text,emotesRaw);return safe.replace(/@(\w+)/g,(_,name)=>`<span class="mention">@${name}</span>`)}
function renderEmotes(text,emotesStr){const replacements=[];emotesStr.split('/').forEach(entry=>{const[id,positions]=entry.split(':');if(!positions)return;positions.split(',').forEach(pos=>{const[start,end]=pos.split('-').map(Number);replacements.push({start,end:end+1,img:emoteImg(id)})})});replacements.sort((a,b)=>b.start-a.start);const chars=[...text];replacements.forEach(({start,end,img})=>chars.splice(start,end-start,img));return chars.join('')}
function renderEmotesObj(text,emotesObj){const replacements=[];for(const[id,positions]of Object.entries(emotesObj)){const posArr=Array.isArray(positions)?positions:[positions];posArr.forEach(pos=>{const[start,end]=(typeof pos==='string'?pos:`${pos.start}-${pos.end}`).split('-').map(Number);replacements.push({start,end:end+1,img:emoteImg(id)})})}replacements.sort((a,b)=>b.start-a.start);const chars=[...text];replacements.forEach(({start,end,img})=>chars.splice(start,end-start,img));return chars.join('')}
function emoteImg(id){return`<img class="emote-img" src="https://static-cdn.jtvnw.net/emoticons/v2/${id}/default/dark/2.0" alt="" loading="lazy">`}
function detectRole(badges){const list=parseBadges(badges),priority=['broadcaster','moderator','vip','subscriber','partner'];for(const p of priority)if(list.some(b=>b.type===p))return p;return'regular'}
function roleColor(role){switch(role){case'broadcaster':return cfg.broadcasterColor||'#00c8ff';case'moderator':return cfg.modColor||'#00ff88';case'vip':return cfg.vipColor||'#a855f7';case'subscriber':return cfg.subColor||'#ffc200';case'partner':return'#9146FF';default:return cfg.accentColor||'#00c8ff'}}
function roleBadgeColor(type){switch(type){case'broadcaster':return cfg.broadcasterColor||'#00c8ff';case'moderator':return cfg.modColor||'#00ff88';case'vip':return cfg.vipColor||'#a855f7';case'subscriber':return cfg.subColor||'#ffc200';case'partner':return'#9146FF';case'turbo':return'#7B68EE';case'premium':return'#FFD700';case'staff':return'#00A8FF';case'admin':return'#FF4500';default:return cfg.accentColor||'#00c8ff'}}
function pruneMessages(container){const all=container.querySelectorAll('.message:not(.removing)'),max=parseInt(cfg.maxMessages)||12;if(all.length<=max)return;const excess=all.length-max;for(let i=0;i<excess;i++){const el=all[i];el.classList.add('removing');setTimeout(()=>el.remove(),350)}}
function enqueueAlert(listener,event){alertQueue.push({listener,event});if(!alertBusy)drainAlertQueue()}
function drainAlertQueue(){if(!alertQueue.length){alertBusy=false;return}alertBusy=true;const{listener,event}=alertQueue.shift();displayAlert(listener,event)}
function displayAlert(listener,event){const config=buildAlertConfig(listener,event);if(!config){drainAlertQueue();return}const container=document.getElementById('alert-container'),card=document.createElement('div');card.className=`alert-card alert-${config.type}`;card.innerHTML=`<div class="alert-icon">${config.icon}</div><div class="alert-content"><div class="alert-title">${escapeHTML(config.title)}</div><div class="alert-message">${escapeHTML(config.message)}</div></div>`;container.appendChild(card);requestAnimationFrame(()=>requestAnimationFrame(()=>card.classList.add('visible')));const duration=(parseFloat(cfg.alertDuration)||5)*1000;setTimeout(()=>{card.classList.add('hiding');setTimeout(()=>{card.remove();drainAlertQueue()},450)},duration)}
function buildAlertConfig(listener,event){const name=event.name||event.displayName||event.sender||'Someone',amount=event.amount||event.count||'',months=event.months||'',msg=event.message?` — "${event.message}"`:'',gifter=event.sender||event.gifterDisplayName||'';switch(listener){case'follower-latest':return{type:'follow',icon:'💙',title:'New Follower!',message:`${name} is now following the channel!`};case'subscriber-latest':if(event.bulkGifted)return{type:'giftsub',icon:'🎁',title:`${amount} Gift Subs!`,message:`${name} gifts ${amount} subs to the community!`};if(event.gifted)return{type:'giftsub',icon:'🎁',title:'Gift Sub!',message:`${gifter} gifted a sub to ${name}!`};return{type:'sub',icon:'⭐',title:months>1?`${months} Months Sub!`:'New Subscriber!',message:months>1?`${name} has been subscribed for ${months} months!${msg}`:`${name} just subscribed!${msg}`};case'cheer-latest':return{type:'bits',icon:'💎',title:`${amount} Bits!`,message:`${name} sent ${amount} bits!${msg}`};case'tip-latest':return{type:'donation',icon:'💰',title:`Donation of ${amount}€!`,message:`${name} donated ${amount}€!${msg}`};case'raid-latest':return{type:'raid',icon:'⚔️',title:'RAID INCOMING!',message:`${name} raids with ${amount} raiders!`};case'host-latest':return{type:'host',icon:'📡',title:'Host!',message:`${name} is hosting with ${amount} viewers!`};default:return null}}
function normHex(h,fb){return(typeof h==='string'&&/^#[0-9a-f]{6}$/i.test(h))?h:fb}
function mixWhite(hex,t){const x=hex.slice(1);return`rgb(${[0,2,4].map(i=>{const v=parseInt(x.substr(i,2),16);return Math.round(v+(255-v)*t)}).join(',')})`}
function setNeonVars(el,nc,uc,fb){nc=normHex(nc,normHex(fb,'#00c8ff'));uc=normHex(uc,nc);const s=el.style;s.setProperty('--nc',nc);s.setProperty('--nc-core',mixWhite(nc,.55));s.setProperty('--nc-60',hexToRgba(nc,.6));s.setProperty('--nc-35',hexToRgba(nc,.35));s.setProperty('--nc-15',hexToRgba(nc,.15));s.setProperty('--uc',uc);s.setProperty('--uc-core',mixWhite(uc,.45))}
function escapeHTML(str){if(typeof str!=='string')return String(str||'');return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
  </script>

<body>

  <!-- ══ Control bar ══ -->
  <div class="preview-bar">
    <h1>🎮 Gamer Chat</h1>

    <span class="status-badge"><span class="status-dot"></span>Live Preview</span>

    <div class="sep"></div>

    <span class="section-label">Style</span>

    <div class="ctrl-group">
      <label>Theme</label>
      <select id="ctrl-theme" onchange="updateWidget()">
        <option value="dark" selected>🌑 Gamer Dark</option>
        <option value="light">☀️ Light</option>
        <option value="amoled">⬛ AMOLED</option>
      </select>
    </div>

    <div class="ctrl-group">
      <label>Animation</label>
      <select id="ctrl-anim" onchange="updateWidget()">
        <option value="spring" selected>⚡ Spring</option>
        <option value="slide">➡️ Slide</option>
        <option value="fade">🌫️ Fade</option>
        <option value="none">✖ None</option>
      </select>
    </div>

    <div class="ctrl-group">
      <label>Alignment</label>
      <select id="ctrl-align" onchange="updateWidget()">
        <option value="left" selected>⬅ Left</option>
        <option value="right">➡ Right</option>
        <option value="center">↔ Center</option>
      </select>
    </div>

    <div class="ctrl-group">
      <label>Font</label>
      <input type="range" id="ctrl-font" min="10" max="24" value="14" oninput="updateWidget()">
    </div>

    <div class="ctrl-group">
      <label>Accent</label>
      <input type="color" id="ctrl-accent" value="#00c8ff" oninput="updateWidget()">
    </div>

    <div class="ctrl-group">
      <label>Neon</label>
      <input type="range" id="ctrl-glow" min="0" max="200" step="10" value="100" oninput="updateWidget(); document.getElementById('lbl-glow').textContent=this.value+'%'">
      <span id="lbl-glow" style="color:rgba(165,185,215,0.6);font-size:10px;min-width:30px">100%</span>
    </div>

    <div class="ctrl-group">
      <label>Flicker</label>
      <input type="checkbox" id="ctrl-flicker" checked onchange="updateWidget()">
    </div>

    <div class="ctrl-group">
      <label>Outline</label>
      <select id="ctrl-neonsrc" onchange="updateWidget()">
        <option value="role" selected>Role color</option>
        <option value="user">Twitch color</option>
      </select>
    </div>

    <div class="ctrl-group">
      <label>Rot X</label>
      <input type="range" id="ctrl-rotx" min="-45" max="45" value="0" oninput="updateWidget(); document.getElementById('lbl-rotx').textContent=this.value+'°'">
      <span id="lbl-rotx" style="color:rgba(165,185,215,0.6);font-size:10px;min-width:26px">0°</span>
    </div>

    <div class="ctrl-group">
      <label>Rot Y</label>
      <input type="range" id="ctrl-roty" min="-45" max="45" value="0" oninput="updateWidget(); document.getElementById('lbl-roty').textContent=this.value+'°'">
      <span id="lbl-roty" style="color:rgba(165,185,215,0.6);font-size:10px;min-width:26px">0°</span>
    </div>

    <div class="sep"></div>

    <span class="section-label">Messages</span>

    <button class="btn" onclick="sendMsg('regular')">Chat</button>
    <button class="btn green" onclick="sendMsg('moderator')">🛡️ Mod</button>
    <button class="btn purple" onclick="sendMsg('vip')">💎 VIP</button>
    <button class="btn orange" onclick="sendMsg('subscriber')">⭐ Sub</button>
    <button class="btn" onclick="sendMsg('broadcaster')">📡 Live</button>

    <div class="sep"></div>

    <span class="section-label">Alerts</span>

    <button class="btn dark" onclick="sendAlert('follow')">💙 Follow</button>
    <button class="btn orange" onclick="sendAlert('sub')">⭐ Sub</button>
    <button class="btn red" onclick="sendAlert('raid')">⚔️ Raid</button>
    <button class="btn purple" onclick="sendAlert('bits')">💎 Bits</button>
    <button class="btn green" onclick="sendAlert('donation')">💰 Donation</button>

    <div class="sep"></div>

    <span class="section-label">Goal</span>

    <div class="ctrl-group">
      <label>Show</label>
      <input type="checkbox" id="ctrl-goal-show" onchange="updateGoalPreview()">
    </div>
    <div class="ctrl-group">
      <label>Orientation</label>
      <select id="ctrl-goal-orient" onchange="updateGoalPreview()">
        <option value="horizontal">─ Horiz.</option>
        <option value="vertical">│ Vert.</option>
      </select>
    </div>
    <div class="ctrl-group">
      <label>Title</label>
      <input type="text" id="ctrl-goal-title" value="Stream goal" oninput="updateGoalPreview()">
    </div>
    <div class="ctrl-group">
      <label>Current</label>
      <input type="number" id="ctrl-goal-cur" value="0" min="0" oninput="updateGoalPreview()">
    </div>
    <div class="ctrl-group">
      <label>Target</label>
      <input type="number" id="ctrl-goal-tgt" value="100" min="1" oninput="updateGoalPreview()">
    </div>
    <div class="ctrl-group">
      <label>Color</label>
      <input type="color" id="ctrl-goal-color" value="#00c8ff" oninput="updateGoalPreview()">
    </div>

    <div class="sep"></div>

    <button class="btn green" id="btn-auto" onclick="toggleAuto()">▶ Auto-Demo</button>
  </div>

  <!-- ══ Preview Stage ══ -->
  <div class="preview-stage">
    <div class="corner-tl"></div>
    <div class="corner-tr"></div>
    <div class="corner-bl"></div>
    <div class="corner-br"></div>
    <iframe id="widget-frame"></iframe>
  </div>

  <!-- ══ Preview JavaScript ══ -->
  <script>
    // ─── Retrieve stored widget code ──────────────────────────
    const widgetHTML = document.getElementById('widget-html').textContent;
    const widgetCSS  = document.getElementById('widget-css').textContent;
    const widgetJS   = document.getElementById('widget-js').textContent;

    let autoMode = false;
    let autoTimer = null;

    // ─── Build & inject the iframe ────────────────────────────
    function buildIframeSrcdoc(overrideFields = {}) {
      const fields = {
        fontSize:          parseInt(document.getElementById('ctrl-font').value),
        theme:             document.getElementById('ctrl-theme').value,
        messageAnimation:  document.getElementById('ctrl-anim').value,
        alignment:         document.getElementById('ctrl-align').value,
        accentColor:       document.getElementById('ctrl-accent').value,
        showBadges:        true,
        showAvatars:       true,
        maxMessages:       12,
        showAlerts:        true,
        alertDuration:     5,
        modColor:          '#00ff88',
        vipColor:          '#a855f7',
        subColor:          '#ffc200',
        perspectiveX:      parseInt(document.getElementById('ctrl-rotx').value),
        perspectiveY:      parseInt(document.getElementById('ctrl-roty').value),
        chatWidth:         100,
        showGoal:          document.getElementById('ctrl-goal-show').checked,
        goalTitle:         document.getElementById('ctrl-goal-title').value,
        goalCurrent:       parseFloat(document.getElementById('ctrl-goal-cur').value) || 0,
        goalTarget:        parseFloat(document.getElementById('ctrl-goal-tgt').value) || 100,
        goalOrientation:   document.getElementById('ctrl-goal-orient').value,
        goalColor:         document.getElementById('ctrl-goal-color').value,
        goalAutoTrack:     true,
        neonGlow:          parseInt(document.getElementById('ctrl-glow').value),
        neonFlicker:       document.getElementById('ctrl-flicker').checked,
        neonColorSource:   document.getElementById('ctrl-neonsrc').value,
        ...overrideFields
      };

      return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>${widgetCSS}</style>
</head>
<body>
${widgetHTML}
<script>
${widgetJS}
// Override widget defaults with preview config
Object.assign(cfg, ${JSON.stringify(fields)});
goalAutoCount = cfg.goalCurrent || 0;
applyConfig();
applyGoal();
<\/script>
</body>
</html>`;
    }

    // ─── Inject into iframe ───────────────────────────────────
    function updateWidget() {
      const frame = document.getElementById('widget-frame');
      frame.srcdoc = buildIframeSrcdoc();
    }

    // ─── Update goal without rebuilding ──────────────────────
    function updateGoalPreview() {
      updateWidget();
    }

    // ─── Send message to iframe ───────────────────────────────
    // Avatar placeholders — consistent per username seed
    const avatarUrl = name =>
      `https://api.dicebear.com/9.x/pixel-art/svg?seed=${encodeURIComponent(name)}&backgroundColor=0a0e1a,101428,0d1020`;

    const names = {
      regular:     ['Tyler', 'Zoe', 'Emma', 'Chris', 'Lily', 'Alex', 'Sam'],
      moderator:   ['ModKevin', 'SentinelX'],
      vip:         ['VipQueen', 'DiamondAlex'],
      subscriber:  ['SubHero', 'LoyalFan99'],
      broadcaster: ['StreamerPro']
    };

    const messages = [
      'PogChamp what a stream!',
      'Chat moving so fast!',
      'Solid stream as always 🔥',
      'GG everyone!',
      'This overlay is fire',
      'What mic are you using?',
      'Let\'s go! 💯',
      'hype hype hype !!!',
      '@Streamer insane play!',
      'Kappa Kappa'
    ];

    function sendMsg(role) {
      const nameList = names[role] || names.regular;
      const name     = nameList[Math.floor(Math.random() * nameList.length)];
      const text     = messages[Math.floor(Math.random() * messages.length)];

      const badgeMap = {
        broadcaster: 'broadcaster/1',
        moderator:   'moderator/1',
        vip:         'vip/1',
        subscriber:  'subscriber/12'
      };

      const colors = {
        regular: ['#FF6B6B','#4ECDC4','#45B7D1','#96CEB4','#DDA0DD','#87CEEB','#F0A500'],
        moderator: ['#00ff88','#00cc70'],
        vip: ['#a855f7','#9333ea'],
        subscriber: ['#ffc200','#ffb000'],
        broadcaster: ['#00c8ff']
      };
      const colorList = colors[role] || colors.regular;
      const userColor = colorList[Math.floor(Math.random() * colorList.length)];

      const event = {
        listener: 'message',
        event: { data: {
          displayName: name,
          text:        text,
          color:       userColor,
          avatar:      avatarUrl(name),
          badges:      badgeMap[role] || '',
          emotes:      '',
          userId:      Math.random().toString(36).slice(2),
          tags:        {}
        }}
      };

      injectEvent(event);
    }

    // ─── Send alert to iframe ─────────────────────────────────
    const alertDefs = {
      follow:   () => ({ listener:'follower-latest',  event:{ name:'RaidLeader' } }),
      sub:      () => ({ listener:'subscriber-latest',event:{ name:'Emma', months:3, message:'GG!' } }),
      raid:     () => ({ listener:'raid-latest',       event:{ name:'RaidLeader', amount:50 } }),
      bits:     () => ({ listener:'cheer-latest',      event:{ name:'Chris', amount:500, message:'PogChamp' } }),
      donation: () => ({ listener:'tip-latest',        event:{ name:'Lily', amount:'5.00', message:'Great stream!' } }),
      giftsub:  () => ({ listener:'subscriber-latest', event:{ name:'Ryan', gifted:true, sender:'AnonymousGifter' } })
    };

    function sendAlert(type) {
      const def = alertDefs[type];
      if (!def) return;
      injectEvent({ ...def(), _isAlert: true });
    }

    // ─── Inject event into iframe ─────────────────────────────
    function injectEvent(payload) {
      const frame = document.getElementById('widget-frame');
      if (!frame.contentWindow) return;

      frame.contentWindow.dispatchEvent(
        new CustomEvent(payload.listener === 'message' ? 'onEventReceived' : 'onEventReceived', {
          detail: payload
        })
      );
    }

    // ─── Auto-demo mode ───────────────────────────────────────
    const autoEvents = [
      () => sendMsg('regular'),
      () => sendMsg('regular'),
      () => sendMsg('subscriber'),
      () => sendMsg('moderator'),
      () => sendMsg('vip'),
      () => sendMsg('regular'),
      () => sendMsg('regular'),
      () => sendAlert('follow'),
      () => sendMsg('regular'),
      () => sendAlert('bits'),
      () => sendMsg('broadcaster'),
      () => sendAlert('sub'),
      () => sendMsg('regular'),
      () => sendAlert('raid'),
    ];
    let autoIdx = 0;

    function toggleAuto() {
      autoMode = !autoMode;
      const btn = document.getElementById('btn-auto');
      if (autoMode) {
        btn.textContent = '⏹ Stop Demo';
        btn.className = 'btn red';
        runAuto();
      } else {
        clearTimeout(autoTimer);
        btn.textContent = '▶ Auto-Demo';
        btn.className = 'btn green';
      }
    }

    function runAuto() {
      if (!autoMode) return;
      autoEvents[autoIdx % autoEvents.length]();
      autoIdx++;
      const delay = 1600 + Math.random() * 800;
      autoTimer = setTimeout(runAuto, delay);
    }

    // ─── Init on load ─────────────────────────────────────────
    window.addEventListener('load', () => {
      updateWidget();
    });
  </script>

</body>
</html>
